<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>시네픽 · 오늘의 영화 추천</title>
<style>

:root {
 color-scheme: light dark;
 --bg: light-dark(#f4f4f4, #161616);
 --paper: light-dark(#ffffff, #222222);
 --surface: light-dark(#f7f7f7, #292929);
 --ink: light-dark(#171717, #f5f5f5);
 --muted: light-dark(#777777, #b0b0b0);
 --line: light-dark(#d8d8d8, #4b4b4b);
 --line-strong: light-dark(#888888, #777777);
 --accent: light-dark(#222222, #555555);
 --dark: light-dark(#111111, #eeeeee);
 --dark-text: light-dark(#ffffff, #171717);
 --soft-red: light-dark(#f0f0f0, #383838);
 --green: light-dark(#555555, #b5b5b5);
 --shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
#app { width: 100%; min-height: 100vh; background: var(--bg); border-radius: 0; }
.topbar { max-width: 1240px; margin: 0 auto; padding: 24px 28px 16px; display:flex; justify-content:space-between; align-items:center; gap:16px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:12px; }
.brand-mark { width:42px; height:42px; display:grid; place-items:center; background:var(--accent); color:#fff; font-size:16px; font-weight:950; letter-spacing:-.08em; border-radius:13px; box-shadow:0 5px 14px rgba(102, 102, 102, 0.18); }
.brand small { display:block; color:var(--muted); font-size:10px; letter-spacing:.2em; font-weight:800; }
.brand h1 { margin:0; font-size:20px; line-height:1.25; letter-spacing:-.05em; }
.brand h1 span { color:var(--accent); }
.topbar { background:var(--paper); }
.top-actions { display:flex; gap:8px; align-items:center; }
.header-search{width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);font-size:27px;line-height:1;display:grid;place-items:center;}
.text-button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:9px 14px; font-size:12px; font-weight:700; }
.text-button:hover { background:var(--surface); }
.hero { max-width:1240px; margin:0 auto; padding:24px 28px 18px; display:flex; justify-content:space-between; align-items:end; gap:20px; }
.kicker { color:var(--accent); font-size:10px; font-weight:900; letter-spacing:.17em; text-transform:uppercase; }
.hero h2 { font-size:clamp(24px,3.6vw,42px); letter-spacing:-.065em; margin:6px 0 8px; line-height:1.08; }
.hero p { color:var(--muted); max-width:600px; margin:0; font-size:13px; }
.hero-meta { display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:11px; white-space:nowrap; }
.hero-meta strong { color:var(--ink); }
.shell { max-width:1240px; margin:0 auto; padding:0 28px 32px; display:grid; grid-template-columns:218px minmax(0,1fr); gap:20px; align-items:start; }
.sidebar { position:sticky; top:14px; border:1px solid var(--line); background:var(--paper); padding:16px 12px 12px; }
.side-label { margin:0 10px 12px; color:var(--muted); font-size:10px; letter-spacing:.15em; font-weight:900; }
.step-link { width:100%; display:flex; gap:11px; align-items:center; border:1px solid transparent; background:transparent; color:var(--ink); text-align:left; padding:11px 10px; border-radius:9px; margin:3px 0; }
.step-link .num { width:25px; height:25px; border:1px solid var(--line-strong); border-radius:50%; display:grid; place-items:center; font-size:11px; flex:none; }
.step-link b { display:block; font-size:12px; }
.step-link small { display:block; color:var(--muted); font-size:10px; margin-top:1px; }
.step-link.active { background:var(--dark); color:var(--dark-text); }
.step-link.active .num { border-color:currentColor; }
.step-link.done:not(.active) .num { border-color:var(--green); color:var(--green); }
.sidebar-note { border-top:1px solid var(--line); margin-top:14px; padding:14px 10px 3px; font-size:11px; color:var(--muted); }
.sidebar-note strong { color:var(--ink); display:block; margin-bottom:3px; }
.main { min-width:0; }
.workspace { border:1px solid var(--line); background:var(--paper); box-shadow:var(--shadow); min-height:600px; }
.workspace-head { padding:21px 24px 17px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
.eyebrow { color:var(--accent); font-size:10px; font-weight:900; letter-spacing:.16em; }
.workspace-head h3 { margin:4px 0 5px; font-size:23px; letter-spacing:-.05em; line-height:1.2; }
.workspace-head p { margin:0; color:var(--muted); font-size:12px; }
.status-pill { flex:none; border:1px solid var(--line); border-radius:99px; padding:7px 10px; font-size:10px; color:var(--muted); font-weight:700; }
.content { padding:24px; }
.section-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; }
.section-row h4 { font-size:13px; margin:0; }
.section-row span { color:var(--muted); font-size:11px; }
.mood-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.mood-card { min-height:117px; border:1px solid var(--line); border-radius:12px; background:var(--paper); padding:14px; text-align:left; color:var(--ink); transition:.15s ease; position:relative; }
.mood-card:hover { border-color:var(--line-strong); transform:translateY(-1px); }
.mood-card.selected { border:1.5px solid var(--ink); box-shadow:inset 0 0 0 1px var(--ink); background:var(--surface); }
.mood-icon { width:35px; height:35px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; font-size:18px; margin-bottom:10px; }
.mood-card strong { font-size:13px; display:block; }
.mood-card small { display:block; font-size:10px; color:var(--muted); margin-top:2px; }
.checkmark { display:none; position:absolute; right:11px; top:11px; background:var(--ink); color:var(--paper); width:18px; height:18px; border-radius:50%; font-size:11px; place-items:center; }
.mood-card.selected .checkmark { display:grid; }
.selection-summary { display:flex; flex-wrap:wrap; gap:7px; padding:12px 0 0; }
.chip { display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); padding:6px 9px; border-radius:999px; font-size:10px; color:var(--ink); }
.chip em { font-style:normal; color:var(--muted); }
.divider { height:1px; background:var(--line); margin:22px 0; }
.actions { display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; margin-top:24px; }
.btn { min-height:43px; padding:11px 18px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); border-radius:8px; font-size:12px; font-weight:800; }
.btn:hover { background:var(--surface); }
.btn.primary { background:var(--dark); color:var(--dark-text); border-color:var(--dark); }
.btn.primary:hover { opacity:.85; }
.btn.full { width:100%; }
.btn:disabled { cursor:not-allowed; opacity:.35; }
.btn.danger { border-color:var(--accent); color:var(--accent); }
.callout { margin-top:18px; border:1px dashed var(--line-strong); padding:12px 14px; color:var(--muted); font-size:11px; border-radius:8px; }
.callout strong { color:var(--ink); }
.duration-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.option-card { min-height:112px; border:1px solid var(--line); background:var(--paper); border-radius:12px; color:var(--ink); padding:16px; text-align:left; }
.option-card.selected { background:var(--dark); color:var(--dark-text); border-color:var(--dark); }
.option-card .option-num { font-size:10px; opacity:.65; letter-spacing:.12em; }
.option-card strong { display:block; font-size:18px; letter-spacing:-.04em; margin:10px 0 2px; }
.option-card small { display:block; font-size:10px; opacity:.7; }

.random-draw-card{width:min(100%,330px);min-height:280px;margin:auto;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 8px 24px rgba(0, 0, 0, 0.05);transition:transform .25s ease,box-shadow .25s ease;}
.random-draw-card .random-draw-icon{display:grid;place-items:center;width:100px;height:100px;margin-bottom:18px;border-radius:50%;background:var(--surface);font-size:48px;}
.random-draw-card h3{margin:0 0 8px;font-size:20px;letter-spacing:-.04em;}
.random-draw-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6;}
.random-draw-card.spinning{animation:random-pulse .45s ease-in-out infinite alternate;}
@keyframes random-pulse{from{transform:scale(1)}to{transform:scale(1.025);box-shadow:0 12px 28px rgba(0, 0, 0, 0.1)}}
.wheel-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,.9fr); gap:24px; align-items:center; }
.wheel-wrap { position:relative; display:grid; place-items:center; padding:12px; }
.wheel-pointer { position:absolute; z-index:2; top:1px; left:50%; transform:translateX(-50%); width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:19px solid var(--accent); }
.wheel { width:min(100%,300px); aspect-ratio:1; border:2px solid var(--ink); border-radius:50%; position:relative; overflow:hidden; background:conic-gradient(from -30deg, var(--paper) 0deg 60deg, var(--surface) 60deg 120deg, var(--paper) 120deg 180deg, var(--surface) 180deg 240deg, var(--paper) 240deg 300deg, var(--surface) 300deg 360deg); transition:transform 3s cubic-bezier(.12,.7,.1,1); box-shadow:inset 0 0 0 6px var(--paper); }
.wheel::before,.wheel::after { content:""; position:absolute; background:var(--line-strong); }
.wheel::before { top:0; bottom:0; left:50%; width:1px; }
.wheel::after { left:0; right:0; top:50%; height:1px; }
.wheel-label { position:absolute; width:33%; text-align:center; font-size:11px; font-weight:800; left:33.5%; top:12%; transform:rotate(0deg); }
.wheel-label.l2 { top:28%;left:57%; transform:rotate(60deg); }
.wheel-label.l3 { top:59%;left:54%; transform:rotate(120deg); }
.wheel-label.l4 { top:72%;left:31%; transform:rotate(180deg); }
.wheel-label.l5 { top:52%;left:7%; transform:rotate(240deg); }
.wheel-label.l6 { top:23%;left:7%; transform:rotate(300deg); }
.wheel-center { position:absolute; left:50%;top:50%;transform:translate(-50%,-50%); border-radius:50%; width:32px;height:32px;background:var(--paper);border:1px solid var(--ink);display:grid;place-items:center;font-size:14px; }
.wheel-panel { border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:20px; }
.wheel-panel h4 { margin:0 0 6px; font-size:16px; }
.wheel-panel p { margin:0; color:var(--muted); font-size:12px; }
.condition-list { display:grid; gap:9px; margin:19px 0; }
.condition-line { display:flex; justify-content:space-between; padding-bottom:9px; border-bottom:1px solid var(--line); font-size:11px; }
.condition-line span:first-child { color:var(--muted); }
.candidate-list { display:grid; gap:12px; }
.candidate-card { display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:14px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--paper); }
.candidate-poster { width:64px; height:96px; aspect-ratio:2/3; border-radius:8px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); font-size:27px; }
.candidate-info { min-width:0; }
.candidate-info h4 { margin:0 0 4px; font-size:15px; letter-spacing:-.03em; }
.candidate-meta { color:var(--muted); font-size:11px; margin-bottom:6px; }
.candidate-info p { color:var(--muted); font-size:11px; margin:0; }
.candidate-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.candidate-tags span { border:1px solid var(--line); border-radius:999px; padding:3px 7px; font-size:10px; }
.candidate-pick { white-space:nowrap; }
@media (max-width:600px) { .candidate-card { grid-template-columns:52px minmax(0,1fr); gap:10px; padding:11px; } .candidate-poster { width:52px; height:78px; } .candidate-pick { grid-column:2; width:100%; } }
.candidate-count { font-size:36px; font-weight:900; letter-spacing:-.06em; line-height:1; margin:5px 0; }
.candidate-count small { font-size:11px; color:var(--muted); letter-spacing:0; }
.spin-note { min-height:22px; margin-top:12px; font-size:11px; color:var(--accent); }
.result-layout { display:grid; grid-template-columns:minmax(220px,.8fr) minmax(0,1.2fr); gap:24px; }
.poster { min-height:300px; border:1px solid var(--line-strong); background:var(--surface); border-radius:10px; overflow:hidden; position:relative; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
.poster::before { content:""; position:absolute; width:220px;height:220px;border-radius:50%;border:1px solid var(--line-strong);top:38px;right:-85px; }
.poster::after { content:""; position:absolute; width:150px;height:150px;border-radius:50%;border:1px dashed var(--line-strong);top:72px;right:-50px; }
.poster-kicker,.poster-title,.poster-foot { position:relative; z-index:1; }
.poster-kicker { font-size:9px; letter-spacing:.2em; font-weight:900; color:var(--accent); }
.poster-title { font-weight:900; font-size:28px; letter-spacing:-.07em; line-height:1.1; max-width:210px; overflow-wrap:anywhere; }
.poster-foot { font-size:10px; color:var(--muted); }
.result-info h4 { font-size:26px; line-height:1.1; letter-spacing:-.06em; margin:0 0 9px; }
.result-info .subline { color:var(--muted); font-size:11px; margin:0 0 14px; }
.tags { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 16px; }
.tag { font-size:10px; border:1px solid var(--line); border-radius:4px; padding:5px 7px; }
.overview { font-size:12px; color:var(--muted); margin:14px 0 20px; line-height:1.8; }
.confirm-banner { border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:20px; display:flex; align-items:center; gap:16px; margin-bottom:20px; }
.confirm-icon { width:64px;height:82px; background:var(--paper);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:25px;flex:none; }
.confirm-banner h4 { margin:0 0 5px;font-size:19px;letter-spacing:-.04em; }
.confirm-banner p { margin:0;color:var(--muted);font-size:11px; }
.stamp-head { display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px; }
.stamp-head h4 { margin:0; font-size:14px; }
.stamp-head span { color:var(--muted);font-size:11px; }
.stamp-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.stamp { min-height:88px; border:1px dashed var(--line-strong); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; text-align:center; color:var(--muted); }
.stamp.filled { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); }
.stamp-mark { width:30px;height:30px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;margin-bottom:5px;font-size:13px; }
.stamp.filled .stamp-mark { background:var(--dark);color:var(--dark-text);border-color:var(--dark); }
.stamp strong { font-size:9px;line-height:1.3; max-width:100%;overflow-wrap:anywhere; }
.stamp small { font-size:8px;color:var(--muted);margin-top:3px; }
.empty-stamps { border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);font-size:12px;grid-column:1/-1; }
.recovery-list { display:grid; gap:12px; }
.recovery { border:1px dashed var(--line-strong); border-radius:10px; padding:16px; display:grid; grid-template-columns:42px minmax(0,1fr); gap:12px; align-items:start; }
.recovery-icon { width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:17px; }
.recovery h4 { margin:0 0 4px;font-size:13px; }
.recovery p { color:var(--muted);margin:0 0 12px;font-size:11px; }
.recovery .btn { min-height:35px;padding:8px 12px;font-size:10px; }
.toast { position:fixed; z-index:20; bottom:22px; left:50%; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:var(--dark);color:var(--dark-text);border-radius:999px;padding:12px 18px;font-size:12px;font-weight:700;box-shadow:var(--shadow);transition:.2s; max-width:calc(100vw - 30px); text-align:center; }
.toast.show { opacity:1;transform:translate(-50%,0); }
.footer { max-width:1240px;margin:0 auto;padding:0 28px 22px;display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:10px; }
.footer strong { color:var(--ink); }
.modal-backdrop { position:fixed;inset:0;background:rgba(0, 0, 0, 0.5);z-index:30;display:grid;place-items:center;padding:20px; }
.modal { width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow); }
.modal h3 { margin:0 0 6px;font-size:21px;letter-spacing:-.04em; }
.modal p { color:var(--muted);font-size:12px;margin:0 0 18px; }
.service-list { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
.service-list button { border:1px solid var(--line);background:var(--surface);padding:12px;border-radius:8px;color:var(--ink);font-weight:800;font-size:12px; }
.modal-actions { display:flex;justify-content:flex-end;margin-top:17px; }
@media (max-width:850px) {
 .topbar,.hero { padding-left:18px;padding-right:18px; }
 .shell { padding:0 18px 24px;grid-template-columns:1fr;gap:12px; }
 .sidebar { position:static;padding:10px;overflow-x:auto; }
 .side-label,.sidebar-note { display:none; }
 .steps-nav { display:flex;min-width:max-content;gap:4px; }
 .step-link { width:auto;min-width:100px;margin:0;padding:8px; }
 .step-link small { display:none; }
 .hero { display:block; }
 .hero-meta { margin-top:13px; }
}
@media (max-width:600px) {
 .topbar { padding-top:15px;padding-bottom:13px; }
 .brand h1 { font-size:16px; }
 .brand-mark { width:36px;height:36px;font-size:19px; }
 .top-actions .text-button:first-child { display:none; }
 .hero { padding-top:21px;padding-bottom:14px; }
 .hero h2 { font-size:28px; }
 .hero p { font-size:12px; }
 .hero-meta { gap:9px;font-size:10px; }
 .shell { padding:0 10px 20px; }
 .workspace { min-height:550px; }
 .workspace-head { padding:17px 15px 14px; }
 .workspace-head h3 { font-size:21px; }
 .workspace-head p { max-width:250px; }
 .content { padding:16px; }
 .mood-grid { grid-template-columns:repeat(2,minmax(0,1fr));gap:8px; }
 .mood-card { min-height:105px;padding:12px; }
 .duration-options { grid-template-columns:1fr; }
 .option-card { min-height:82px;padding:12px; }

 .wheel-layout,.result-layout { grid-template-columns:1fr;gap:15px; }
 .wheel { width:min(78vw,275px); }
 .wheel-panel { padding:15px; }
 .poster { min-height:250px; }

 .confirm-banner { align-items:flex-start;padding:14px; }
 .confirm-icon { width:48px;height:64px; }
 .stamp-grid { grid-template-columns:repeat(5,minmax(0,1fr));gap:5px; }
 .stamp { min-height:74px;padding:4px; }
 .stamp-mark { width:24px;height:24px;font-size:11px; }

}
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } }

.tabs { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; margin-bottom:20px; }
.tabs button { border:0; background:transparent; color:var(--ink); padding:11px; font-size:12px; font-weight:800; }
.tabs button[aria-selected="true"] { background:var(--dark); color:var(--dark-text); }
.lvbox { border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:16px; }
.lvhead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
.lvhead strong { font-size:15px; letter-spacing:-.03em; }
.cinema-progress{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:12px}.cinema-progress-segment{height:7px;border-radius:99px;background:var(--line);transition:background .2s}.cinema-progress-segment.filled{background:var(--accent)}
.lvbadge { display:inline-block; background:var(--dark); color:var(--dark-text); border-radius:999px; padding:2px 9px; font-size:10px; font-weight:900; margin-right:8px; letter-spacing:.04em; }
.lvhead span { color:var(--muted); font-size:11px; }
.lvnote { color:var(--muted); font-size:11px; margin:8px 0 0; }
.lvup { border:1.5px solid var(--accent); background:var(--soft-red); border-radius:10px; padding:16px; text-align:center; margin-bottom:16px; }
.lvup b { display:block; color:var(--accent); font-size:19px; letter-spacing:-.04em; }

 async function searchMovieAPI(query){
   const url=new URL('https://api.themoviedb.org/3/search/movie');
   url.searchParams.set('api_key',TMDB_API_KEY); url.searchParams.set('query',query);
   url.searchParams.set('language','ko-KR'); url.searchParams.set('include_adult','false');
   const res=await fetch(url.toString()); if(!res.ok) throw new Error('TMDB '+res.status);
   const data=await res.json();
   const hits=(data.results||[]).filter(r=>r.title||r.original_title);

 let apiMovies=[];
 let apiCatalogPromise=null;
 async function loadApiCatalog(){
   if(apiCatalogPromise) return apiCatalogPromise;
   apiCatalogPromise=(async()=>{
     const gathered=[];
     // TMDB discover pages contain up to 20 films each; request 8 pages and trim to 150.
     for(let page=1;page<=20 && gathered.length<150;page++){
       const url=new URL('https://api.themoviedb.org/3/discover/movie');
       url.searchParams.set('api_key',TMDB_API_KEY);
       url.searchParams.set('language','ko-KR');
       url.searchParams.set('sort_by','popularity.desc');
       url.searchParams.set('include_adult','false');
       url.searchParams.set('page',String(page));
       const res=await fetch(url.toString());
       if(!res.ok) throw new Error('TMDB '+res.status);
       const data=await res.json();
       const genreMap={28:'액션',12:'모험',16:'애니메이션',35:'코미디',80:'범죄',99:'다큐멘터리',18:'드라마',10751:'가족',14:'판타지',36:'역사',27:'공포',10402:'음악',9648:'미스터리',10749:'로맨스',878:'SF',10770:'TV 영화',53:'스릴러',10752:'전쟁',37:'서부'};
       for(const r of (data.results||[])){
         if(!r.title && !r.original_title) continue;
         const title=r.title||r.original_title;
         const year=Number((r.release_date||'').slice(0,4))||'';
         if(movies.some(x=>norm(x.title)===norm(title) && String(x.year)===String(year))) continue;
         if(gathered.some(x=>x.tmdbId===r.id)) continue;
         const genres=(r.genre_ids||[]).map(id=>genreMap[id]).filter(Boolean);
         gathered.push({id:'api_'+r.id,title,en:(r.original_title||title).toUpperCase(),year,runtime:null,genre:genres.join(' · ')||'영화',moods:['심심한','센치한'],food:'팝콘',tone:'새로운 영화를 발견하는 밤',overview:r.overview||'줄거리 정보가 없습니다.',poster:r.poster_path?TMDB_IMAGE+r.poster_path:'',source:'A',tmdbId:r.id});
         if(gathered.length>=150) break;
       }
     }
     // Discover results omit runtime; retrieve movie details with a small concurrency limit.
     let runtimeIndex=0;
     const runtimeWorkers=Array.from({length:6},async()=>{
       while(runtimeIndex<gathered.length){
         const m=gathered[runtimeIndex++];
         try{
           const detailUrl=new URL(`https://api.themoviedb.org/3/movie/${m.tmdbId}`);
           detailUrl.searchParams.set('api_key',TMDB_API_KEY);
           detailUrl.searchParams.set('language','ko-KR');
           const detailRes=await fetch(detailUrl.toString());
           if(detailRes.ok){const detail=await detailRes.json();m.runtime=Number(detail.runtime)||null;}
         }catch(_){m.runtime=null;}
       }
     });
     await Promise.all(runtimeWorkers);
     apiMovies=gathered;
     apiMovies.forEach(m=>{if(!movies.some(x=>x.id===m.id)) movies.push(m);});
     const status=document.getElementById('datasetStatus');
     if(status) status.textContent=`총 ${localMovies.length+apiMovies.length}편 · J ${localMovies.length} / A ${apiMovies.length}`;
     if(state.activeTab==='browse') updateBrowse();
     return apiMovies;
   })();
   return apiCatalogPromise;
 }

 function spinRoulette(){

 <div class="home-section-title">나의 영화</div><div class="home-shortcuts"><button class="home-shortcut" id="myTickets"><strong>나의 티켓북</strong><small>발권한 영화 ${t.length}편 보기 →</small></button><button class="home-shortcut" id="mySaved"><strong>보관한 영화</strong><small>저장한 영화 ${b.length}편 보기 →</small></button></div>
 <div class="profile-row"><span>서비스 안내</span><span>시네픽 프로토타입</span></div>
 <div class="profile-row"><span>저장 방식</span><span>이 브라우저에 저장</span></div>
 <button class="btn full" id="profileReset" style="margin-top:20px">영화 추천 처음부터 시작</button>
 </div>`;
 $('#profileReset').addEventListener('click', () => { state.mood=null; state.movie=null; state.activeTab='recommend'; setStep(1); });
 $('#myTickets').addEventListener('click', () => { state.activeTab='recommend'; state.step=6; state.tab='tickets'; render(); });
 $('#mySaved').addEventListener('click', () => { state.activeTab='recommend'; state.step=6; state.tab='bookmarks'; render(); });
 }
 function updateAppTabs(){
 document.querySelectorAll('.app-tab').forEach(b=>{
 const tab=b.dataset.appTab;
 const active=tab===state.activeTab;
 b.classList.toggle('active',active);
 if(active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
 });
 }
 function render(){
 clearInterval(decideTimer); decideTimer = null;
 if(state.spinning && state.step !== 3){ clearTimeout(spinTimeout); state.spinning = false; }
 updateNavigation(); updateAppTabs();
 if(state.activeTab==='home') renderHome();
 else if(state.activeTab==='browse') renderBrowse();
 else if(state.activeTab==='review') renderReviewTab();
 else if(state.activeTab==='mypage') renderMyPage();
 else ({1:renderMood,2:renderDuration,3:renderWheel,4:renderResult,5:renderConfirmed,6:renderTicketbook,7:() => renderRecovery('all')})[state.step]();
 updateAppTabs();
 window.scrollTo(0, 0);
 }
 document.getElementById('headerSearch').addEventListener('click', () => { if(state.activeTab !== 'home'){ state.activeTab='home'; render(); } const panel=document.getElementById('homeSearchPanel'); if(panel){ const open=panel.style.display !== 'none'; panel.style.display=open?'none':'block'; if(!open) document.getElementById('homeQ').focus(); } });
 // 하단 탭은 항상 공통 render() 경로를 통해 화면 전체를 전환합니다.
 // 둘러보기를 누르면 커뮤니티 리뷰 목록을 즉시 렌더링합니다.
 document.querySelectorAll('[data-app-tab]').forEach(b=>b.addEventListener('click',()=>{
 const tab=b.dataset.appTab;
 state.activeTab=tab;

 if(tab==='recommend') { if(state.step===6 || state.step===7) state.step=1; if(!state.mood) state.step=1; }
 render();
 }));
 function updateNavigation(){
 document.querySelectorAll('.step-link').forEach(b => {
 const s = Number(b.dataset.step);
 b.classList.toggle('active', s === state.step);
 b.classList.toggle('done', state.step <= 5 && s < state.step);
 if(s === state.step) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');
 });
 }
 document.querySelectorAll('.step-link').forEach(b => b.addEventListener('click', () => setStep(Number(b.dataset.step))));
  loadPosterCache();
 render();
 loadApiCatalog().catch(err=>{
   const status=document.getElementById('datasetStatus');
   if(status) status.textContent='API 영화 로딩 실패 · JSON 150편 사용 중';
   console.warn('TMDB catalog load failed',err);
 });

 loadTMDBPosters();
})();
</script>
