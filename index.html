<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f4f4">
<title>시네픽 · 오늘의 영화 추천</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><p style="padding:16px">시네픽을 이용하려면 브라우저에서 JavaScript를 활성화해 주세요.</p></noscript>
<div id="app">
 <header class="topbar">
 <button class="brand" id="homeLogo" type="button" aria-label="시네픽 홈으로 이동" style="border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer"><span class="brand-mark">SP</span><span><small>CINEPICK · MOVIE CURATION</small><h1><span>시네픽</span></h1></span></button>
 <button class="header-search" id="headerSearch" aria-label="영화 검색" title="영화 검색"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
 </header>
 <div class="shell">
 <main class="main"><section class="workspace" id="workspace" aria-live="polite"></section></main>
 </div>
</div>

 <nav class="app-tabbar" aria-label="하단 메뉴">
 <button class="app-tab active" data-app-tab="home"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg></span><span>홈</span></button>
 <button class="app-tab" data-app-tab="browse" aria-label="다른 사용자 감상평 둘러보기"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span><span>탐색</span></button>
 <button class="app-tab" data-app-tab="review"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.8-3A7.5 7.5 0 1 1 20 11.5Z"/><path d="m12.5 7.5.8 1.7 1.7.3-1.3 1.2.3 1.8-1.5-.9-1.5.9.3-1.8L10 9.5l1.7-.3z"/></svg></span><span>리뷰</span></button>
 <button class="app-tab" data-app-tab="mypage"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.7-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></span><span>마이</span></button>
 </nav>

<div class="toast" id="toast" role="status"></div><div id="datasetStatus" style="position:fixed;right:12px;bottom:84px;z-index:20;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--muted);box-shadow:0 2px 10px #0002">JSON 150 + API 150 준비 중</div>
<div id="modalRoot"></div>
<script src="data/movies.js"></script>
<script src="js/app.js"></script>
</body>
</html>
