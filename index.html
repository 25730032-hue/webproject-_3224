<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>시네픽 · 오늘의 영화 추천</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
 <header class="topbar">
 <div class="brand"><div class="brand-mark">SP</div><div><small>CINEPICK · MOVIE CURATION</small><h1><span>시네픽</span></h1></div></div>
 <div class="top-actions"><button class="text-button" id="headerRecords">내 티켓북 보기 ↗</button><button class="text-button" id="resetApp">처음부터</button></div><button class="header-search" id="headerSearch" aria-label="영화 검색" title="영화 검색">⌕</button>
 </header>
 <section class="hero">
 <div class="hero-meta"><span><strong>01</strong> 기분 선택</span><span><strong>02</strong> 후보 확인</span><span><strong>03</strong> 직접 선택 또는 랜덤 추첨</span><span><strong>04</strong> 티켓 발권</span></div>
 </section>
 <div class="shell">
 <aside class="sidebar">
 <p class="side-label">YOUR MOVIE FLOW</p>
 <nav class="steps-nav" aria-label="앱 화면 단계">
 <button class="step-link active" data-step="1"><span class="num">1</span><span><b>기분 선택</b><small>지금 어떤 기분인가요?</small></span></button>
 <button class="step-link" data-step="3"><span class="num">2</span><span><b>후보 둘러보기</b><small>직접 고르거나 랜덤 추첨</small></span></button>
 <button class="step-link" data-step="4"><span class="num">4</span><span><b>추천 결과</b><small>마음에 드는 영화 선택</small></span></button>
 <button class="step-link" data-step="5"><span class="num">5</span><span><b>확정 · 발권</b><small>매칭 티켓 만들기</small></span></button>
 <button class="step-link" data-step="6"><span class="num">6</span><span><b>티켓북</b><small>도장판 · 레벨 · 보관</small></span></button>
 <button class="step-link" data-step="7"><span class="num">7</span><span><b>예외 상황</b><small>막히면 여기서 해결</small></span></button>
 </nav>
 <div class="sidebar-note"><strong>ONE NIGHT, ONE MOVIE</strong>선택 피로를 줄이는 작은 영화 의식. 정답보다 지금의 기분을 먼저 생각해요.</div>
 </aside>
 <main class="main"><section class="workspace" id="workspace" aria-live="polite"></section></main>
 </div>
 <footer class="footer"><span><strong>LO-FI PROTOTYPE</strong> · 영화 정보는 화면 테스트용 예시 데이터입니다.</span><span>티켓과 보관 목록은 이 브라우저에 저장됩니다.</span></footer>
</div>

 <nav class="app-tabbar" aria-label="하단 메뉴">
 <button class="app-tab active" data-app-tab="home"><span class="tab-icon">⌂</span><span>홈</span></button>
 <button class="app-tab" data-app-tab="browse" aria-label="다른 사용자 감상평 둘러보기"><span class="tab-icon"></span><span>둘러보기</span></button>
 <button class="app-tab" data-app-tab="mypage"><span class="tab-icon"></span><span>마이페이지</span></button>
 </nav>

<div class="toast" id="toast" role="status"></div>
<div id="modalRoot"></div>
<script src="js/script.js"></script>
</body>
</html>
