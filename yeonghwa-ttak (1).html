<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화딱 - 기분 × 시간 영화 룰렛</title>
<style>
:root{--bg:#2a2b66;--paper:#f2f0fa;--ink:#1b1b3a;--sub:#5d5c85;--rule:#c9c6e6;--acc:#f08a24;--red:#c8372d;--ok:#2e7d5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 12px}
#app{width:100%;max-width:390px}
.top{color:var(--paper);display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px}
.top b{font-size:18px}
.nav{display:flex;gap:6px}
.nav button{background:transparent;border:1px solid rgba(242,240,250,.5);color:var(--paper);border-radius:16px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}
.nav button[aria-current="true"]{background:var(--paper);color:var(--ink)}
.tk{background:var(--paper);border-radius:14px;padding:20px 18px;position:relative;min-height:520px;display:flex;flex-direction:column;gap:14px}
.tk::before,.tk::after{content:"";position:absolute;top:58px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.tk::before{left:-8px}.tk::after{right:-8px}
.hd{padding-bottom:14px;border-bottom:2px dashed var(--rule)}
.hd h1{font-size:21px;margin:0 0 4px}.hd p{margin:0;font-size:13px;color:var(--sub)}
.lb{font-size:13px;font-weight:700;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:12px 6px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.3}
.opt small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.opt[aria-pressed="true"] small{color:var(--rule)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:0;border-radius:8px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:var(--ink);width:100%}
.btn.sec{background:transparent;border:1.5px solid var(--ink)}
.btn.sm{padding:7px 10px;font-size:12px;width:auto}
.btn:disabled{background:var(--rule);color:var(--sub);border-color:transparent;cursor:not-allowed}
.row{display:flex;gap:8px}.row .btn{flex:1}.row .w{flex:1.5}
.push{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.chip{display:inline-block;border:1px solid var(--ink);border-radius:20px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
.chip.m{border-color:var(--sub);color:var(--sub)}
.note{font-size:13px;margin:0;min-height:18px;color:var(--red)}
.note.ok{color:var(--ok)}
.box{border:1.5px dashed var(--sub);border-radius:8px;padding:16px;text-align:center;font-size:13px;color:var(--sub)}
.box b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.mv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.card{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ps{aspect-ratio:2/3;border:1.5px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;overflow:hidden;color:rgba(27,27,58,.55)}
.ps img{width:100%;height:100%;object-fit:cover}
.card:hover .ps,.card:focus-visible .ps{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.mn{font-size:12px;font-weight:700;line-height:1.3;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mg{font-size:11px;color:var(--sub);margin-top:1px}
.wheel{position:relative;width:240px;height:240px;margin:6px auto}
.wheel svg{width:100%;height:100%;overflow:visible}
.wheel .g{transform-origin:100px 100px;transition:transform 3.2s cubic-bezier(.12,.7,.15,1)}
.ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border:10px solid transparent;border-top:18px solid var(--red);border-bottom:0;z-index:2}
.ttl{font-size:20px;font-weight:700;margin:0}
.ov{font-size:13px;line-height:1.6;color:var(--sub);margin:0}
.res{display:flex;gap:14px;align-items:flex-start}
.res .ps{width:104px;flex:none;font-size:38px}
.tmr{display:flex;justify-content:space-between;align-items:center;border:1.5px dashed var(--red);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--red)}
.tmr b{font-size:18px;font-variant-numeric:tabular-nums}
.pair{border-left:3px solid var(--acc);padding:2px 0 2px 10px;font-size:13px}
.pair small{display:block;color:var(--sub);font-size:11px}
.ott{display:flex;flex-wrap:wrap;gap:6px}
.ott a{border:1.5px solid var(--ink);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none}
.ott a.s{border-style:dashed;color:var(--sub);border-color:var(--sub)}
.stub{background:#fff;border:2px dashed var(--sub);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stub .k{font-size:11px;color:var(--acc);font-weight:700;letter-spacing:.04em}
.stub .t{font-size:20px;font-weight:700}
.stub .d{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:transparent;font:inherit;font-size:14px;padding:9px;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.sb{border:1.5px solid var(--ink);border-radius:10px;padding:12px}
.sbh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--acc)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st{aspect-ratio:1;border:1.5px dashed var(--rule);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--rule)}
.st.f{border:2px solid var(--red);color:var(--red);font-weight:700;transform:rotate(-8deg)}
.tcard{border:1.5px solid var(--ink);border-radius:10px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:8px}
.tcard .h{display:flex;gap:10px;align-items:center}
.tcard .ps{width:44px;flex:none;font-size:18px}
.tcard .n{font-weight:700;font-size:14px}.tcard .s{font-size:11px;color:var(--sub)}
.memo{display:flex;gap:6px}
.memo input{flex:1;min-width:0;border:1.5px solid var(--rule);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;color:var(--ink);background:var(--paper)}
.memo input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.tc{font-size:11px;color:var(--ok);min-height:14px;margin:0}
.lvup{background:var(--ink);color:var(--paper);border-radius:10px;padding:14px;text-align:center;border:2px solid var(--acc)}
.lvup b{display:block;font-size:20px;color:var(--acc);margin-bottom:2px}
.lvup span{font-size:13px}
.lvbadge{display:inline-block;background:var(--acc);color:var(--ink);border-radius:12px;padding:1px 9px;font-size:12px;font-weight:700;margin-right:6px}
.btn.dg{border-color:var(--red);color:var(--red)}
.btn.dg.on{background:var(--red);color:#fff}
.ov-bg{position:fixed;inset:0;background:rgba(20,20,50,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:390px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet .x{align-self:flex-end;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);padding:0 4px}
.sheet .ps{height:170px;aspect-ratio:auto;font-size:48px}
.sheet.err{border-radius:14px;margin:auto 18px;max-width:340px;text-align:center}
.ov-bg.c{align-items:center}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.wheel .g{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const MOODS=[
 {k:"a",tag:"#신나는_도파민",label:"신나는 도파민"},
 {k:"b",tag:"#연인과_헤어졌을때",label:"연인과 헤어졌을 때"},
 {k:"c",tag:"#뇌비우고_웃고싶을때",label:"뇌 비우고 웃고 싶을 때"},
 {k:"d",tag:"#감성타는_밤",label:"감성 타는 밤"},
 {k:"e",tag:"#스릴_반전",label:"스릴 반전"},
 {k:"f",tag:"#잔잔한_힐링",label:"잔잔한 힐링"}
];
const TIMES=[{v:90,label:"90분 이하"},{v:120,label:"120분 이하"},{v:0,label:"상관없음"}];
const MOOD_BY_KEY=Object.fromEntries(MOODS.map(m=>[m.k,m]));

/* 샘플 데이터. 실제 서비스에서는 movies.json 으로 분리하고 fetch 로 불러오세요. */
const RAW=[
["mov_001","라라랜드","뮤지컬/로맨스",128,"bd","꿈을 좇는 두 사람이 만나 사랑하고, 각자의 길 앞에 서는 이야기.","와인 + 치즈",[]],
["mov_002","인사이드 아웃","애니메이션",95,"bcf","머릿속 감정들이 소녀의 이사와 성장을 함께 겪는 이야기.","초코 아이스크림",[]],
["mov_003","월터의 상상은 현실이 된다","모험/드라마",114,"cf","상상만 하던 소심한 남자가 실제 모험을 떠나는 이야기.","컵라면 + 삼각김밥",[]],
["mov_004","리틀 포레스트","드라마",103,"f","시골로 돌아온 청년이 사계절 음식으로 일상을 회복하는 이야기.","비빔면 + 계란",[]],
["mov_005","센과 치히로의 행방불명","애니메이션/판타지",125,"af","이상한 세계에 들어간 소녀가 부모를 구하려 일하며 성장하는 이야기.","떡볶이 + 튀김",[]],
["mov_006","극한직업","코미디/액션",111,"ac","잠복근무하던 마약반이 치킨집을 인수하며 벌어지는 소동.","후라이드 치킨 + 캔맥주",[{name:"Netflix",url:"https://www.netflix.com"}]],
["mov_007","어바웃 타임","로맨스/판타지",123,"bd","시간을 되돌리는 능력을 가진 남자가 사랑과 일상의 가치를 깨닫는 이야기.","핫초코 + 쿠키",[]],
["mov_008","비포 선라이즈","로맨스",101,"d","기차에서 만난 두 사람이 빈에서 하룻밤 동안 걷고 이야기하는 영화.","와인 + 샌드위치",[]],
["mov_009","퍼펙트 데이즈","드라마",124,"df","도쿄 공중화장실 청소부의 단정한 하루하루를 따라가는 이야기.","편의점 샌드위치 + 커피",[]],
["mov_010","이웃집 토토로","애니메이션",86,"f","시골로 이사 온 자매가 숲의 정령 토토로를 만나는 이야기.","주먹밥 + 보리차",[]],
["mov_011","나 홀로 집에","코미디",103,"ac","혼자 집에 남은 소년이 도둑들을 막아내는 소동극.","피자 + 콜라",[]],
["mov_012","위플래쉬","드라마",106,"ae","드러머 지망생과 광기 어린 교수의 극한 대결.","맥주 + 감자튀김",[]],
["mov_013","인턴","코미디/드라마",121,"cf","70세 인턴이 젊은 CEO 곁에서 건네는 따뜻한 조언.","카페라떼 + 마들렌",[]],
["mov_014","소울","애니메이션",100,"bdf","재즈 피아니스트가 영혼의 세계에서 삶의 의미를 다시 찾는 이야기.","피자 + 탄산수",[]],
["mov_015","컨택트","SF",116,"de","외계 언어를 해독하는 언어학자가 시간과 선택을 마주하는 이야기.","따뜻한 차 + 쿠키",[]],
["mov_016","매드 맥스: 분노의 도로","액션",120,"ae","사막을 질주하는 추격전만으로 끝까지 달리는 영화.","나초 + 콜라",[]],
["mov_017","서치","스릴러/미스터리",102,"ea","실종된 딸의 컴퓨터 화면만을 추적하며 반전을 찾아나가는 디지털 스릴러.","나초 치즈 딥 + 콜라",[{name:"Netflix",url:"https://www.netflix.com"}]],
["mov_018","500일의 서머","로맨스/드라마",95,"bd","사랑을 운명이라 믿는 탐과 환상이라 믿는 서머의 500일간 연애 기록.","아메리카노 + 조각 케이크",[{name:"Disney+",url:"https://www.disneyplus.com"}]],
["mov_019","클라우스","애니메이션/힐링",85,"fc","우체부와 장난감 장인이 만나 마을에 따뜻한 기적을 만들어내는 이야기.","핫초코 + 마시멜로",[{name:"Netflix",url:"https://www.netflix.com"}]]
];
const gsearch=t=>"https://www.google.com/search?q="+encodeURIComponent(t+" 영화 시청");
let MOVIES=[];
function loadMovies(){
 const list=RAW.map(a=>({id:a[0],title:a[1],genre:a[2],runningTime:a[3],moodTags:a[4].split("").map(k=>MOOD_BY_KEY[k].tag),oneLinePoint:a[5],pairingFood:a[6],ottList:a[7],posterUrl:"",searchUrl:gsearch(a[1])}));
 if(!list.length)throw new Error("empty");
 MOVIES=list;
}

const S={screen:"home",mood:null,maxTime:null,pool:[],pick:null,last:null,slices:[],spin:false,left:10,tab:"tickets",from:"wheel",modal:null,msg:"",ok:false,loadErr:false,delId:null,lvUp:null};
const $=document.getElementById("app"),$m=document.getElementById("modal");
let timer=null;

const mem={tickets:[],bm:[]};
function rd(key,fb){try{const v=localStorage.getItem(key);return v?JSON.parse(v):mem[fb]}catch(e){return mem[fb]}}
function wr(key,fb,val){mem[fb]=val;try{localStorage.setItem(key,JSON.stringify(val));return true}catch(e){return false}}
const tickets=()=>rd("savedTickets","tickets");
const bookmarks=()=>rd("bookmarkedIds","bm");
const saveTickets=v=>wr("savedTickets","tickets",v);
const saveBm=v=>wr("bookmarkedIds","bm",v);
const TITLES=["우유부단 견습생","선택 장애 탈출러","룰렛 단골","영화 고르기 달인","영화딱 마스터"];
function lvInfo(total){const lv=Math.floor(total/10)+1;return{lv,cur:total%10,next:10-total%10,name:TITLES[Math.min(lv,TITLES.length)-1]}}
const byId=id=>MOVIES.find(m=>m.id===id);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue=m=>(Number(m.id.slice(4))*47)%360;
const poster=(m,c)=>`<div class="ps ${c||""}" style="background:hsl(${hue(m)} 45% 82%)">${m.posterUrl?`<img src="${esc(m.posterUrl)}" alt="${esc(m.title)} 포스터">`:esc(m.title[0])}</div>`;
const moodLabel=()=>MOODS.find(m=>m.tag===S.mood)?.label||"";
const timeLabel=()=>TIMES.find(t=>t.v===S.maxTime)?.label||"";
const head=(t,p)=>`<div class="hd"><h1>${t}</h1><p>${p}</p></div>`;

function go(s){S.screen=s;S.msg="";S.ok=false;S.delId=null;if(s!=="issued")S.lvUp=null;if(s!=="result")stopTimer();render()}
function stopTimer(){clearInterval(timer);timer=null}
function startTimer(){
 stopTimer();S.left=10;
 timer=setInterval(()=>{
  S.left--;
  const t=document.getElementById("tmr"),b=document.getElementById("respin");
  if(t)t.textContent=String(Math.max(S.left,0)).padStart(2,"0")+"초";
  if(S.left<=0){stopTimer();if(b){b.disabled=false;b.textContent="다시 뽑기"}}
  else if(b)b.textContent=`다시 뽑기 (${S.left}초)`;
 },1000);
}

function filterPool(){
 return MOVIES.filter(m=>m.moodTags.includes(S.mood)&&(S.maxTime===0||m.runningTime<=S.maxTime));
}

function homeView(){
 const ready=S.mood&&S.maxTime!==null;
 return head("야식 식기 전에,<br>딱 한 편만.","기분과 시간만 고르면 룰렛이 한 편을 뽑아줘요.")+
 `<div><p class="lb">지금 기분은?</p><div class="grid">${MOODS.map(m=>`<button class="opt" data-a="mood" data-v="${m.tag}" aria-pressed="${S.mood===m.tag}">${m.label}<small>${m.tag}</small></button>`).join("")}</div></div>
 <div><p class="lb">볼 수 있는 시간은?</p><div class="times">${TIMES.map(t=>`<button class="opt" data-a="time" data-v="${t.v}" aria-pressed="${S.maxTime===t.v}">${t.label}</button>`).join("")}</div></div>
 <div class="push"><button class="btn" data-a="start" ${ready?"":"disabled"}>룰렛 돌리기</button></div>`;
}
function emptyView(){
 return `<div class="box" style="margin-top:20px"><b>조건에 맞는 영화가 없어요</b>${esc(moodLabel())} · ${esc(timeLabel())}</div>
 <div class="push"><button class="btn" data-a="anytime">시간 상관없이 다시 찾기</button><button class="btn sec" data-a="reset">필터 초기화</button></div>`;
}
function wheelView(){
 const sl=S.slices.length?S.slices:Array(8).fill({title:"?"}),n=sl.length,a=360/n;
 const pt=th=>[100+92*Math.sin(th*Math.PI/180),100-92*Math.cos(th*Math.PI/180)];
 const paths=sl.map((x,i)=>{const p1=pt(i*a),p2=pt((i+1)*a),t=x.title.length>5?x.title.slice(0,5)+"…":x.title;
  return `<path d="M100 100L${p1[0]} ${p1[1]}A92 92 0 0 1 ${p2[0]} ${p2[1]}Z" fill="${i%2?"#e4e1f5":"#f2f0fa"}" stroke="#1b1b3a" stroke-width="1.2"/><text transform="rotate(${(i+.5)*a} 100 100)" x="100" y="32" text-anchor="middle" font-size="9" fill="#1b1b3a">${esc(t)}</text>`}).join("");
 return head("룰렛",`${esc(moodLabel())} · ${esc(timeLabel())} · 후보 ${S.pool.length}편`)+
 `<div class="wheel"><div class="ptr"></div><svg viewBox="0 0 200 200" role="img" aria-label="영화 룰렛"><g class="g" id="g">${paths}</g><circle cx="100" cy="100" r="9" fill="#f2f0fa" stroke="#1b1b3a" stroke-width="1.5"/></svg></div>
 <div class="push"><button class="btn" data-a="spin" ${S.spin?"disabled":""}>${S.spin?"돌아가는 중…":"돌리기"}</button>
 <div class="row"><button class="btn sec" data-a="list" ${S.spin?"disabled":""}>후보 ${S.pool.length}편 보기</button><button class="btn sec" data-a="reset" ${S.spin?"disabled":""}>조건 바꾸기</button></div></div>`;
}
function listView(){
 return head("후보 영화",`${esc(moodLabel())} · ${esc(timeLabel())} · 포스터를 누르면 정보가 나와요`)+
 `<div class="mv">${S.pool.map(x=>`<button class="card" data-a="open" data-v="${x.id}" aria-label="${esc(x.title)} 정보 보기">${poster(x)}<div class="mn">${esc(x.title)}</div><div class="mg">${esc(x.genre.split("/")[0])} · ${x.runningTime}분</div></button>`).join("")}</div>
 <div class="push"><button class="btn" data-a="toWheel">룰렛으로 돌아가기</button></div>`;
}
function resultView(){
 const m=S.pick,wait=S.left>0;
 return `<div class="tmr"><span>스킵 방지 타이머</span><b id="tmr">${String(Math.max(S.left,0)).padStart(2,"0")}초</b></div>
 <div class="res">${poster(m)}<div><p class="ttl">${esc(m.title)}</p><div style="margin:6px 0 8px"><span class="chip">${esc(m.genre)}</span><span class="chip">${m.runningTime}분</span></div><p class="ov">${esc(m.oneLinePoint)}</p></div></div>
 <div>${m.moodTags.map(t=>`<span class="chip m">${esc(t)}</span>`).join("")}</div>
 <div class="push"><button class="btn" data-a="open" data-v="${m.id}">상세 보기 · 티켓 발권</button>
 <button class="btn sec" id="respin" data-a="respin" ${wait?"disabled":""}>${wait?`다시 뽑기 (${S.left}초)`:"다시 뽑기"}</button></div>`;
}
function issuedView(){
 const m=S.pick,all=tickets(),t=all.find(x=>x.movieId===m.id)||all[0],L=lvInfo(all.length);
 const up=S.lvUp?`<div class="lvup" role="status"><b>LEVEL UP! Lv.${S.lvUp.lv}</b><span>도장 10개 완성 · ${esc(S.lvUp.name)}</span></div>`:"";
 return head("티켓이 발권됐어요","오늘 밤은 이 영화로 결정!")+up+
 `<div class="stub"><span class="k">MATCHING TICKET</span><span class="t">${esc(m.title)}</span><div class="d"><span>${esc(t?t.savedDate:today())}</span><span>No. ${esc(t?t.ticketId:"-")}</span></div></div>
 <p class="note ${S.ok?"ok":""}">${esc(S.msg||`Lv.${L.lv} · 도장 ${L.cur}/10`)}</p>
 <div class="push"><button class="btn" data-a="my">티켓북 보기</button><button class="btn sec" data-a="reset">처음으로</button></div>`;
}
function myView(){
 const t=tickets(),b=bookmarks();
 let body="";
 if(S.tab==="tickets"){
  const L=lvInfo(t.length),n=L.cur;
  body=`<div class="sb"><div class="sbh"><span><span class="lvbadge">Lv.${L.lv}</span>${esc(L.name)}</span><span>${n} / 10</span></div><div class="bar"><i style="width:${n*10}%"></i></div><p class="tc" style="color:var(--sub);margin:0 0 8px">${L.next===10&&t.length>0?"새 레벨 시작! 도장 10개를 다시 모아보세요.":`다음 레벨까지 ${L.next}개`}</p>
  <div class="stamps">${Array.from({length:10},(_,i)=>i<n?`<div class="st f">${i+1}</div>`:`<div class="st">${i+1}</div>`).join("")}</div></div>`+
  (t.length?t.map(x=>{const m=byId(x.movieId);if(!m)return"";return `<div class="tcard"><div class="h">${poster(m)}<div><div class="n">${esc(m.title)}</div><div class="s">${esc(x.savedDate)} · No. ${esc(x.ticketId)}</div></div></div>
   <div class="memo"><input type="text" id="memo-${esc(x.ticketId)}" value="${esc(x.memo||"")}" maxlength="40" placeholder="한 줄 감상 메모" aria-label="${esc(m.title)} 메모"><button class="btn sec sm" data-a="memo" data-v="${esc(x.ticketId)}">저장</button><button class="btn sec sm dg ${S.delId===x.ticketId?"on":""}" data-a="del" data-v="${esc(x.ticketId)}">${S.delId===x.ticketId?"정말 삭제":"삭제"}</button></div><p class="tc" id="mm-${esc(x.ticketId)}"></p></div>`}).join("")
  :`<div class="box"><b>아직 발권한 티켓이 없어요</b>룰렛을 돌려 첫 티켓을 만들어보세요.</div>`);
 }else{
  body=b.length?`<div class="mv">${b.map(id=>byId(id)).filter(Boolean).map(x=>`<button class="card" data-a="open" data-v="${x.id}" aria-label="${esc(x.title)} 정보 보기">${poster(x)}<div class="mn">${esc(x.title)}</div><div class="mg">${x.runningTime}분</div></button>`).join("")}</div>`
  :`<div class="box"><b>보관한 영화가 없어요</b>상세 화면에서 보관을 눌러 모아보세요.</div>`;
 }
 return head("마이","발권한 티켓과 보관한 영화")+
 `<div class="tabs" role="tablist"><button role="tab" data-a="tab" data-v="tickets" aria-selected="${S.tab==="tickets"}">티켓북 ${t.length}</button><button role="tab" data-a="tab" data-v="bookmarks" aria-selected="${S.tab==="bookmarks"}">보관 ${b.length}</button></div>${body}
 <div class="push"><button class="btn" data-a="reset">룰렛 돌리러 가기</button></div>`;
}
function view(){
 return {home:homeView,empty:emptyView,wheel:wheelView,list:listView,result:resultView,issued:issuedView,my:myView}[S.screen]();
}
function render(){
 $.innerHTML=`<div class="top"><b>영화딱</b><nav class="nav" aria-label="메뉴"><button data-a="reset" aria-current="${S.screen==="home"}">홈</button><button data-a="my" aria-current="${S.screen==="my"}">티켓북</button></nav></div><div class="tk">${view()}</div>`;
 window.scrollTo(0,0);
}
function renderModal(){
 if(S.loadErr){
  $m.innerHTML=`<div class="ov-bg c" role="alertdialog" aria-modal="true" aria-label="데이터 로딩 실패"><div class="sheet err"><p class="ttl">영화 데이터를 불러오지 못했어요</p><p class="ov">잠시 후 다시 시도해 주세요.</p><button class="btn" data-a="retry">다시 시도</button></div></div>`;return;
 }
 const m=S.modal&&byId(S.modal);
 if(!m){$m.innerHTML="";return}
 const bm=bookmarks().includes(m.id);
 const ott=m.ottList.map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.name)}</a>`).join("")+`<a class="s" href="${esc(m.searchUrl)}" target="_blank" rel="noopener">검색으로 찾기</a>`;
 $m.innerHTML=`<div class="ov-bg" data-a="close" role="dialog" aria-modal="true" aria-label="${esc(m.title)} 상세"><div class="sheet"><button class="x" data-a="close" aria-label="닫기" id="xbtn">✕</button>
 ${poster(m)}<div><p class="ttl">${esc(m.title)}</p><div style="margin-top:6px"><span class="chip">${esc(m.genre)}</span><span class="chip">${m.runningTime}분</span>${m.moodTags.map(t=>`<span class="chip m">${esc(t)}</span>`).join("")}</div></div>
 <p class="ov">${esc(m.oneLinePoint)}</p>
 <div class="pair"><small>야식 페어링</small>${esc(m.pairingFood)}</div>
 <div><p class="lb">볼 수 있는 곳</p><div class="ott">${ott}</div></div>
 <p class="note ${S.ok?"ok":""}" id="mnote">${esc(S.msg)}</p>
 <div class="row"><button class="btn sec" data-a="bm" data-v="${m.id}">${bm?"보관 해제":"보관"}</button><button class="btn w" data-a="issue" data-v="${m.id}">티켓 발권</button></div></div></div>`;
 const x=document.getElementById("xbtn");if(x)x.focus();
}
function openModal(id){S.modal=id;S.msg="";S.ok=false;renderModal()}
function closeModal(){S.modal=null;S.msg="";S.ok=false;renderModal()}

function spin(){
 const n=S.pool.length;let i=Math.floor(Math.random()*n);
 if(n>1&&S.last&&S.pool[i].id===S.last)i=(i+1)%n;
 const pick=S.pool[i];
 const others=S.pool.filter(m=>m.id!==pick.id).sort(()=>Math.random()-.5).slice(0,7);
 const sl=[pick,...others].sort(()=>Math.random()-.5);
 S.slices=sl;S.pick=pick;S.last=pick.id;S.spin=true;S.screen="wheel";
 render();
 const g=document.getElementById("g"),k=sl.indexOf(pick),a=360/sl.length;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transform=`rotate(${360*5-(k*a+a/2)}deg)`}));
 setTimeout(()=>{S.spin=false;S.screen="result";S.msg="";render();startTimer()},3400);
}
function issue(id){
 const all=tickets();
 if(all.some(t=>t.movieId===id&&t.savedDate===today())){S.msg="오늘 이미 발권한 영화예요.";S.ok=false;renderModal();return}
 const t={ticketId:"t_"+Date.now().toString(36),movieId:id,savedDate:today(),memo:""};
 const saved=saveTickets([t,...all]);
 const before=lvInfo(all.length),after=lvInfo(all.length+1);
 S.lvUp=after.lv>before.lv?after:null;
 S.pick=byId(id);S.modal=null;renderModal();
 S.msg=saved?"티켓북에 저장했어요.":"이 브라우저에는 저장하지 못했어요. 창을 닫기 전까지만 유지돼요.";S.ok=saved;
 stopTimer();S.screen="issued";render();
}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 if(b.classList.contains("ov-bg")&&e.target!==b)return;
 const a=b.dataset.a,v=b.dataset.v;
 if(a==="mood"){S.mood=v;render()}
 else if(a==="time"){S.maxTime=Number(v);render()}
 else if(a==="start"){S.pool=filterPool();S.slices=[];S.last=null;if(!S.pool.length)go("empty");else go("wheel")}
 else if(a==="anytime"){S.maxTime=0;S.pool=filterPool();S.slices=[];if(!S.pool.length)go("empty");else go("wheel")}
 else if(a==="spin"){spin()}
 else if(a==="respin"){spin()}
 else if(a==="list"){go("list")}
 else if(a==="toWheel"){S.slices=[];go("wheel")}
 else if(a==="open"){openModal(v)}
 else if(a==="close"){closeModal()}
 else if(a==="bm"){
  const cur=bookmarks();const next=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];
  const ok=saveBm(next);S.msg=ok?"":"보관 내용을 저장하지 못했어요.";S.ok=false;renderModal();if(S.screen==="my")render()}
 else if(a==="issue"){issue(v)}
 else if(a==="my"){S.tab="tickets";go("my")}
 else if(a==="tab"){S.tab=v;S.delId=null;render()}
 else if(a==="memo"){
  const all=tickets(),t=all.find(x=>x.ticketId===v),inp=document.getElementById("memo-"+v),msg=document.getElementById("mm-"+v);
  if(t&&inp){t.memo=inp.value.trim();const ok=saveTickets(all);if(msg)msg.textContent=ok?"메모를 저장했어요.":"저장하지 못했어요."}}
 else if(a==="del"){
  if(S.delId===v){saveTickets(tickets().filter(t=>t.ticketId!==v));S.delId=null;render()}
  else{S.delId=v;render()}}
 else if(a==="reset"){Object.assign(S,{mood:null,maxTime:null,pool:[],slices:[],pick:null});go("home")}
 else if(a==="retry"){init()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal)closeModal()});

function init(){
 try{loadMovies();S.loadErr=false}catch(e){S.loadErr=true}
 render();renderModal();
}
init();
</script>
</body>
</html>
