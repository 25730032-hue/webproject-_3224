<script>
/* CinePick 공통 LocalStorage: 서비스 접두사, 안전한 JSON 읽기/쓰기 */
window.cineStorageKey=function(key){const k=String(key);return k.startsWith('cinepick_')?k:'cinepick_'+k;};
window.cineRead=function(key,fallback=null){try{const namespaced=cineStorageKey(key);let raw=localStorage.getItem(namespaced);if(raw===null){raw=localStorage.getItem(String(key));if(raw!==null){localStorage.setItem(namespaced,raw);}}return raw===null?fallback:JSON.parse(raw);}catch(e){try{localStorage.removeItem(cineStorageKey(key));}catch(_){}return fallback;}};
window.cineWrite=function(key,value){try{localStorage.setItem(cineStorageKey(key),JSON.stringify(value));return true;}catch(e){return false;}};
window.cineRemove=function(key){try{localStorage.removeItem(cineStorageKey(key));return true;}catch(e){return false;}};
</script><!doctype html>

/* 시네픽 티켓 찢기 애니메이션 */
.ticket-tear-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:rgba(15, 15, 15, 0.78);backdrop-filter:blur(5px);animation:tear-fade-in .22s ease-out both;}
.ticket-tear-stage{width:min(92vw,420px);text-align:center;color:#fff;}
.ticket-tear-caption{font-size:11px;font-weight:900;letter-spacing:.2em;color:#d0d0d0;margin-bottom:16px;}
.ticket-tear-title{font-size:clamp(22px,5vw,32px);font-weight:900;letter-spacing:-.06em;margin:0 0 7px;}
.ticket-tear-subtitle{font-size:12px;color:rgba(255, 255, 255, 0.72);margin:0 0 28px;}
.tear-ticket{position:relative;width:min(100%,340px);height:142px;margin:0 auto 24px;color:#211f1d;filter:drop-shadow(0 16px 24px rgba(0, 0, 0, 0.25));}
.tear-ticket-half{position:absolute;left:0;width:100%;height:50%;display:flex;align-items:center;justify-content:center;gap:14px;background:#fffaf0;overflow:hidden;}
.tear-ticket-top{top:0;border-radius:12px 12px 0 0;clip-path:polygon(0 0,100% 0,100% 100%,95% 94%,90% 100%,85% 94%,80% 100%,75% 94%,70% 100%,65% 94%,60% 100%,55% 94%,50% 100%,45% 94%,40% 100%,35% 94%,30% 100%,25% 94%,20% 100%,15% 94%,10% 100%,5% 94%,0 100%);animation:ticket-top-tear .95s cubic-bezier(.2,.8,.2,1) .18s both;}
.tear-ticket-bottom{bottom:0;border-radius:0 0 12px 12px;clip-path:polygon(0 0,5% 6%,10% 0,15% 6%,20% 0,25% 6%,30% 0,35% 6%,40% 0,45% 6%,50% 0,55% 6%,60% 0,65% 6%,70% 0,75% 6%,80% 0,85% 6%,90% 0,95% 6%,100% 0,100% 100%,0 100%);animation:ticket-bottom-tear .95s cubic-bezier(.2,.8,.2,1) .18s both;}
.tear-ticket-top:before,.tear-ticket-bottom:before{content:"";position:absolute;left:22px;top:0;bottom:0;border-left:1px dashed #c9c9c9;}
.tear-ticket-top .tear-mark{font-size:31px;}
.tear-ticket-top .tear-movie{font-size:19px;font-weight:950;letter-spacing:-.05em;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tear-ticket-bottom{font-size:10px;font-weight:900;letter-spacing:.18em;color:#333333;}
.tear-ticket-bottom .tear-code{font-size:25px;letter-spacing:.08em;border:1px solid #d8d8d8;padding:7px 12px;border-radius:5px;}
.ticket-tear-foot{font-size:11px;letter-spacing:.04em;color:rgba(255, 255, 255, 0.78);animation:tear-foot-in .35s ease-out 1s both;}
@keyframes ticket-top-tear{0%{transform:translate(0,0) rotate(0);opacity:1}55%{transform:translate(-8px,-20px) rotate(-4deg)}100%{transform:translate(-65px,-95px) rotate(-17deg);opacity:0}}
@keyframes ticket-bottom-tear{0%{transform:translate(0,0) rotate(0);opacity:1}55%{transform:translate(8px,20px) rotate(4deg)}100%{transform:translate(65px,95px) rotate(17deg);opacity:0}}
@keyframes tear-fade-in{from{opacity:0}to{opacity:1}}
@keyframes tear-foot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.ticket-tear-overlay,.tear-ticket-top,.tear-ticket-bottom,.ticket-tear-foot{animation-duration:.01ms!important;animation-delay:0ms!important}}

/* 룰렛 원판 + 10초 결정 타이머 */
.roulette{width:min(100%,300px);aspect-ratio:1;display:block;transition:transform 3.2s cubic-bezier(.12,.7,.1,1);filter:drop-shadow(0 8px 18px rgba(0, 0, 0, 0.08));}

.decide-track,.timer-track{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0;}
.decide-bar,.timer-progress{height:100%;width:100%;background:var(--dark);border-radius:99px;}
.timer-progress{background:var(--accent);}

.decide-box.urgent strong{color:var(--accent);}
@keyframes decide-pulse{from{transform:scale(1)}to{transform:scale(1.12)}}

:root {
 color-scheme: light dark;
 --bg: light-dark(#f4f4f4, #161616);
 --paper: light-dark(#ffffff, #222222);
 --surface: light-dark(#f7f7f7, #292929);
 --ink: light-dark(#171717, #f5f5f5);
 --muted: light-dark(#777777, #b0b0b0);
 --line: light-dark(#d8d8d8, #4b4b4b);
 --line-strong: light-dark(#888888, #777777);
 --accent: light-dark(#222222, #555555);
 --dark: light-dark(#111111, #eeeeee);
 --dark-text: light-dark(#ffffff, #171717);
 --soft-red: light-dark(#f0f0f0, #383838);
 --green: light-dark(#555555, #b5b5b5);
 --shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
#app { width: 100%; min-height: 100vh; background: var(--bg); border-radius: 0; }
.topbar { max-width: 1240px; margin: 0 auto; padding: 24px 28px 16px; display:flex; justify-content:space-between; align-items:center; gap:16px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:12px; }
.brand-mark { width:42px; height:42px; display:grid; place-items:center; background:var(--accent); color:#fff; font-size:16px; font-weight:950; letter-spacing:-.08em; border-radius:13px; box-shadow:0 5px 14px rgba(102, 102, 102, 0.18); }
.brand small { display:block; color:var(--muted); font-size:10px; letter-spacing:.2em; font-weight:800; }
.brand h1 { margin:0; font-size:20px; line-height:1.25; letter-spacing:-.05em; }
.brand h1 span { color:var(--accent); }
.topbar { background:var(--paper); }
.top-actions { display:flex; gap:8px; align-items:center; }
.header-search{width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);font-size:27px;line-height:1;display:grid;place-items:center;}
.text-button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:9px 14px; font-size:12px; font-weight:700; }
.text-button:hover { background:var(--surface); }
.hero { max-width:1240px; margin:0 auto; padding:24px 28px 18px; display:flex; justify-content:space-between; align-items:end; gap:20px; }
.kicker { color:var(--accent); font-size:10px; font-weight:900; letter-spacing:.17em; text-transform:uppercase; }
.hero h2 { font-size:clamp(24px,3.6vw,42px); letter-spacing:-.065em; margin:6px 0 8px; line-height:1.08; }
.hero p { color:var(--muted); max-width:600px; margin:0; font-size:13px; }
.hero-meta { display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:11px; white-space:nowrap; }
.hero-meta strong { color:var(--ink); }
.shell { max-width:1240px; margin:0 auto; padding:0 28px 32px; display:grid; grid-template-columns:218px minmax(0,1fr); gap:20px; align-items:start; }
.sidebar { position:sticky; top:14px; border:1px solid var(--line); background:var(--paper); padding:16px 12px 12px; }
.side-label { margin:0 10px 12px; color:var(--muted); font-size:10px; letter-spacing:.15em; font-weight:900; }
.step-link { width:100%; display:flex; gap:11px; align-items:center; border:1px solid transparent; background:transparent; color:var(--ink); text-align:left; padding:11px 10px; border-radius:9px; margin:3px 0; }
.step-link .num { width:25px; height:25px; border:1px solid var(--line-strong); border-radius:50%; display:grid; place-items:center; font-size:11px; flex:none; }
.step-link b { display:block; font-size:12px; }
.step-link small { display:block; color:var(--muted); font-size:10px; margin-top:1px; }
.step-link.active { background:var(--dark); color:var(--dark-text); }
.step-link.active .num { border-color:currentColor; }
.step-link.done:not(.active) .num { border-color:var(--green); color:var(--green); }
.sidebar-note { border-top:1px solid var(--line); margin-top:14px; padding:14px 10px 3px; font-size:11px; color:var(--muted); }
.sidebar-note strong { color:var(--ink); display:block; margin-bottom:3px; }
.main { min-width:0; }
.workspace { border:1px solid var(--line); background:var(--paper); box-shadow:var(--shadow); min-height:600px; }
.workspace-head { padding:21px 24px 17px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
.eyebrow { color:var(--accent); font-size:10px; font-weight:900; letter-spacing:.16em; }
.workspace-head h3 { margin:4px 0 5px; font-size:23px; letter-spacing:-.05em; line-height:1.2; }
.workspace-head p { margin:0; color:var(--muted); font-size:12px; }
.status-pill { flex:none; border:1px solid var(--line); border-radius:99px; padding:7px 10px; font-size:10px; color:var(--muted); font-weight:700; }
.content { padding:24px; }
.section-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; }
.section-row h4 { font-size:13px; margin:0; }
.section-row span { color:var(--muted); font-size:11px; }
.mood-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.mood-card { min-height:117px; border:1px solid var(--line); border-radius:12px; background:var(--paper); padding:14px; text-align:left; color:var(--ink); transition:.15s ease; position:relative; }
.mood-card:hover { border-color:var(--line-strong); transform:translateY(-1px); }
.mood-card.selected { border:1.5px solid var(--ink); box-shadow:inset 0 0 0 1px var(--ink); background:var(--surface); }
.mood-icon { width:35px; height:35px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; font-size:18px; margin-bottom:10px; }
.mood-card strong { font-size:13px; display:block; }
.mood-card small { display:block; font-size:10px; color:var(--muted); margin-top:2px; }
.checkmark { display:none; position:absolute; right:11px; top:11px; background:var(--ink); color:var(--paper); width:18px; height:18px; border-radius:50%; font-size:11px; place-items:center; }
.mood-card.selected .checkmark { display:grid; }
.selection-summary { display:flex; flex-wrap:wrap; gap:7px; padding:12px 0 0; }
.chip { display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); padding:6px 9px; border-radius:999px; font-size:10px; color:var(--ink); }
.chip em { font-style:normal; color:var(--muted); }
.divider { height:1px; background:var(--line); margin:22px 0; }
.actions { display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; margin-top:24px; }
.btn { min-height:43px; padding:11px 18px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); border-radius:8px; font-size:12px; font-weight:800; }
.btn:hover { background:var(--surface); }
.btn.primary { background:var(--dark); color:var(--dark-text); border-color:var(--dark); }
.btn.primary:hover { opacity:.85; }
.btn.full { width:100%; }
.btn:disabled { cursor:not-allowed; opacity:.35; }
.btn.danger { border-color:var(--accent); color:var(--accent); }
.callout { margin-top:18px; border:1px dashed var(--line-strong); padding:12px 14px; color:var(--muted); font-size:11px; border-radius:8px; }
.callout strong { color:var(--ink); }
.duration-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.option-card { min-height:112px; border:1px solid var(--line); background:var(--paper); border-radius:12px; color:var(--ink); padding:16px; text-align:left; }
.option-card.selected { background:var(--dark); color:var(--dark-text); border-color:var(--dark); }
.option-card .option-num { font-size:10px; opacity:.65; letter-spacing:.12em; }
.option-card strong { display:block; font-size:18px; letter-spacing:-.04em; margin:10px 0 2px; }
.option-card small { display:block; font-size:10px; opacity:.7; }

.random-draw-card{width:min(100%,330px);min-height:280px;margin:auto;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 8px 24px rgba(0, 0, 0, 0.05);transition:transform .25s ease,box-shadow .25s ease;}
.random-draw-card .random-draw-icon{display:grid;place-items:center;width:100px;height:100px;margin-bottom:18px;border-radius:50%;background:var(--surface);font-size:48px;}
.random-draw-card h3{margin:0 0 8px;font-size:20px;letter-spacing:-.04em;}
.random-draw-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6;}
.random-draw-card.spinning{animation:random-pulse .45s ease-in-out infinite alternate;}
@keyframes random-pulse{from{transform:scale(1)}to{transform:scale(1.025);box-shadow:0 12px 28px rgba(0, 0, 0, 0.1)}}
.wheel-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,.9fr); gap:24px; align-items:center; }
.wheel-wrap { position:relative; display:grid; place-items:center; padding:12px; }
.wheel-pointer { position:absolute; z-index:2; top:1px; left:50%; transform:translateX(-50%); width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:19px solid var(--accent); }
.wheel { width:min(100%,300px); aspect-ratio:1; border:2px solid var(--ink); border-radius:50%; position:relative; overflow:hidden; background:conic-gradient(from -30deg, var(--paper) 0deg 60deg, var(--surface) 60deg 120deg, var(--paper) 120deg 180deg, var(--surface) 180deg 240deg, var(--paper) 240deg 300deg, var(--surface) 300deg 360deg); transition:transform 3s cubic-bezier(.12,.7,.1,1); box-shadow:inset 0 0 0 6px var(--paper); }
.wheel::before,.wheel::after { content:""; position:absolute; background:var(--line-strong); }
.wheel::before { top:0; bottom:0; left:50%; width:1px; }
.wheel::after { left:0; right:0; top:50%; height:1px; }
.wheel-label { position:absolute; width:33%; text-align:center; font-size:11px; font-weight:800; left:33.5%; top:12%; transform:rotate(0deg); }
.wheel-label.l2 { top:28%;left:57%; transform:rotate(60deg); }
.wheel-label.l3 { top:59%;left:54%; transform:rotate(120deg); }
.wheel-label.l4 { top:72%;left:31%; transform:rotate(180deg); }
.wheel-label.l5 { top:52%;left:7%; transform:rotate(240deg); }
.wheel-label.l6 { top:23%;left:7%; transform:rotate(300deg); }
.wheel-center { position:absolute; left:50%;top:50%;transform:translate(-50%,-50%); border-radius:50%; width:32px;height:32px;background:var(--paper);border:1px solid var(--ink);display:grid;place-items:center;font-size:14px; }
.wheel-panel { border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:20px; }
.wheel-panel h4 { margin:0 0 6px; font-size:16px; }
.wheel-panel p { margin:0; color:var(--muted); font-size:12px; }
.condition-list { display:grid; gap:9px; margin:19px 0; }
.condition-line { display:flex; justify-content:space-between; padding-bottom:9px; border-bottom:1px solid var(--line); font-size:11px; }
.condition-line span:first-child { color:var(--muted); }
.candidate-list { display:grid; gap:12px; }
.candidate-card { display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:14px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--paper); }
.candidate-poster { width:64px; height:96px; aspect-ratio:2/3; border-radius:8px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); font-size:27px; }
.candidate-info { min-width:0; }
.candidate-info h4 { margin:0 0 4px; font-size:15px; letter-spacing:-.03em; }
.candidate-meta { color:var(--muted); font-size:11px; margin-bottom:6px; }
.candidate-info p { color:var(--muted); font-size:11px; margin:0; }
.candidate-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.candidate-tags span { border:1px solid var(--line); border-radius:999px; padding:3px 7px; font-size:10px; }
.candidate-pick { white-space:nowrap; }
@media (max-width:600px) { .candidate-card { grid-template-columns:52px minmax(0,1fr); gap:10px; padding:11px; } .candidate-poster { width:52px; height:78px; } .candidate-pick { grid-column:2; width:100%; } }
.candidate-count { font-size:36px; font-weight:900; letter-spacing:-.06em; line-height:1; margin:5px 0; }
.candidate-count small { font-size:11px; color:var(--muted); letter-spacing:0; }
.spin-note { min-height:22px; margin-top:12px; font-size:11px; color:var(--accent); }

/* 시네픽 티켓 찢기 애니메이션 */
.ticket-tear-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:rgba(15, 15, 15, 0.78);backdrop-filter:blur(5px);animation:tear-fade-in .22s ease-out both;}
.ticket-tear-stage{width:min(92vw,420px);text-align:center;color:#fff;}
.ticket-tear-caption{font-size:11px;font-weight:900;letter-spacing:.2em;color:#d0d0d0;margin-bottom:16px;}
.ticket-tear-title{font-size:clamp(22px,5vw,32px);font-weight:900;letter-spacing:-.06em;margin:0 0 7px;}
.ticket-tear-subtitle{font-size:12px;color:rgba(255, 255, 255, 0.72);margin:0 0 28px;}
.tear-ticket{position:relative;width:min(100%,340px);height:142px;margin:0 auto 24px;color:#211f1d;filter:drop-shadow(0 16px 24px rgba(0, 0, 0, 0.25));}
.tear-ticket-half{position:absolute;left:0;width:100%;height:50%;display:flex;align-items:center;justify-content:center;gap:14px;background:#fffaf0;overflow:hidden;}
.tear-ticket-top{top:0;border-radius:12px 12px 0 0;clip-path:polygon(0 0,100% 0,100% 100%,95% 94%,90% 100%,85% 94%,80% 100%,75% 94%,70% 100%,65% 94%,60% 100%,55% 94%,50% 100%,45% 94%,40% 100%,35% 94%,30% 100%,25% 94%,20% 100%,15% 94%,10% 100%,5% 94%,0 100%);animation:ticket-top-tear .95s cubic-bezier(.2,.8,.2,1) .18s both;}
.tear-ticket-bottom{bottom:0;border-radius:0 0 12px 12px;clip-path:polygon(0 0,5% 6%,10% 0,15% 6%,20% 0,25% 6%,30% 0,35% 6%,40% 0,45% 6%,50% 0,55% 6%,60% 0,65% 6%,70% 0,75% 6%,80% 0,85% 6%,90% 0,95% 6%,100% 0,100% 100%,0 100%);animation:ticket-bottom-tear .95s cubic-bezier(.2,.8,.2,1) .18s both;}
.tear-ticket-top:before,.tear-ticket-bottom:before{content:"";position:absolute;left:22px;top:0;bottom:0;border-left:1px dashed #c9c9c9;}
.tear-ticket-top .tear-mark{font-size:31px;}
.tear-ticket-top .tear-movie{font-size:19px;font-weight:950;letter-spacing:-.05em;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tear-ticket-bottom{font-size:10px;font-weight:900;letter-spacing:.18em;color:#333333;}
.tear-ticket-bottom .tear-code{font-size:25px;letter-spacing:.08em;border:1px solid #d8d8d8;padding:7px 12px;border-radius:5px;}
.ticket-tear-foot{font-size:11px;letter-spacing:.04em;color:rgba(255, 255, 255, 0.78);animation:tear-foot-in .35s ease-out 1s both;}
@keyframes ticket-top-tear{0%{transform:translate(0,0) rotate(0);opacity:1}55%{transform:translate(-8px,-20px) rotate(-4deg)}100%{transform:translate(-65px,-95px) rotate(-17deg);opacity:0}}
@keyframes ticket-bottom-tear{0%{transform:translate(0,0) rotate(0);opacity:1}55%{transform:translate(8px,20px) rotate(4deg)}100%{transform:translate(65px,95px) rotate(17deg);opacity:0}}
@keyframes tear-fade-in{from{opacity:0}to{opacity:1}}
@keyframes tear-foot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.ticket-tear-overlay,.tear-ticket-top,.tear-ticket-bottom,.ticket-tear-foot{animation-duration:.01ms!important;animation-delay:0ms!important}}

/* 룰렛 원판 + 10초 결정 타이머 */

/* 영화 검색 + 리뷰 쓰기 */
.search-box{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line-strong);border-radius:12px;padding:0 6px 0 12px;background:var(--paper);margin-bottom:6px;}
.search-box:focus-within{border-color:var(--ink);}
.search-box span{color:var(--muted);font-size:17px;}
.search-box input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:12px 0;outline:none;}
.search-box input::-webkit-search-cancel-button{display:none;}
.search-clear{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;}
.search-hint{font-size:11px;color:var(--muted);padding:6px 2px 0;}
.review-card.mine{border-color:var(--accent);background:var(--soft-red);}
.mine-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;margin-right:5px;font-weight:900;font-size:9px;}
.star-input{display:flex;align-items:center;gap:2px;margin:0 0 12px;}
.star-input button{border:0;background:transparent;font-size:30px;line-height:1;padding:2px;color:var(--line);}
.star-input button.on{color:#666666;}
.star-input span{margin-left:8px;font-size:12px;color:var(--muted);}
.review-field{display:block;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px;font:inherit;font-size:13px;margin-bottom:8px;resize:vertical;}
.review-field:focus-visible{outline:3px solid var(--accent);outline-offset:1px;}
.rv-foot{display:flex;justify-content:space-between;align-items:center;}
.rv-len{font-size:10px;color:var(--muted);}
.modal{max-height:calc(100dvh - 40px);overflow-y:auto;}
.food-badge{display:inline-grid;place-items:center;margin-left:6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:12px;vertical-align:middle;cursor:help;flex:none;}
#homeResults .search-hint{display:none;}
#homeResults .tlist{margin-top:0;}

/* ===== 아이콘 · 포스터 보강 ===== */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.btn .ic{width:1.1em;height:1.1em;margin-right:6px}
.app-tab .tab-icon{display:grid;place-items:center;height:24px;line-height:1}
.app-tab .tab-icon .ic{width:23px;height:23px}
.mood-icon .ic{width:20px;height:20px}
.checkmark .ic{width:11px;height:11px;stroke-width:2.6}
.stamp-mark .ic{width:14px;height:14px;stroke-width:2.4}
.shortcut-icon{display:block;margin-bottom:2px}
.shortcut-icon .ic{width:22px;height:22px}
.header-search .ic{width:20px;height:20px}
.search-clear{display:grid;place-items:center}
.search-clear .ic{width:14px;height:14px}
.profile-avatar .ic{width:26px;height:26px}
.recovery-icon .ic{width:18px;height:18px}
.starsvg{fill:none}
.on .starsvg,.review-stars .starsvg.f{fill:currentColor}
.review-stars{display:flex;align-items:center;gap:1px}
.review-stars .ic{width:13px;height:13px}
.star-input button{display:grid;place-items:center;color:var(--line-strong)}
.star-input button .ic{width:28px;height:28px}
.star-input button.on{color:var(--ink)}
.pw{display:block;width:100%;height:100%}
.pimg{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--line-strong);text-align:center;padding:6px}
.ph .ic{width:min(45%,30px);height:auto;aspect-ratio:1}
.ph b{display:none}
.candidate-poster,.confirm-icon,.tcard .g,.review-poster,.review-detail-poster{overflow:hidden;padding:0}
.poster{padding:0;min-height:0;aspect-ratio:2/3;max-width:230px;margin:0 auto;width:100%}
.poster::before,.poster::after{display:none}
.poster .ph{gap:12px;padding:18px}
.poster .ph .ic{width:42px}
.poster .ph b{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.35;color:var(--muted);word-break:keep-all}
.candidate-info p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.decide-head .ic{margin-right:5px}



.today-movie-card .candidate-info h4{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.today-movie-card .candidate-info h4 .source-flag{position:static;width:19px;height:19px;border-radius:5px;font-size:10px;box-shadow:none;flex:none}
\n
.browse-movie-card{cursor:pointer;transition:transform .15s,border-color .15s}
.browse-movie-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.browse-movie-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.detail-x{position:absolute;top:10px;right:12px;border:0;background:transparent;color:var(--ink);font-size:30px;line-height:1;cursor:pointer;padding:2px 8px;z-index:2}
.movie-detail-modal{position:relative;width:min(560px,100%);max-height:calc(100dvh - 36px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.movie-detail-head{display:flex;gap:14px;align-items:flex-start}
.movie-detail-poster{width:100px;flex:0 0 100px;aspect-ratio:2/3;overflow:hidden;border-radius:10px;background:var(--surface)}
.movie-detail-poster .pw,.movie-detail-poster .pimg,.movie-detail-poster .ph{display:block;width:100%;height:100%;object-fit:cover}
.movie-detail-title{font-size:19px;font-weight:850;line-height:1.3;margin:0 0 7px}
.movie-detail-title .source-flag{position:static;width:19px;height:19px;display:inline-grid;vertical-align:middle;border-radius:5px;font-size:10px;box-shadow:none}
.movie-detail-meta{font-size:11px;color:var(--muted);line-height:1.6}
.movie-detail-overview{font-size:13px;line-height:1.75;white-space:pre-wrap;margin:16px 0;color:var(--text)}
.movie-detail-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
@media(max-width:420px){.movie-detail-modal{padding:14px}.movie-detail-poster{width:76px;flex-basis:76px}.movie-detail-title{font-size:16px}}
\n.browse-movie-list{display:grid;gap:10px;margin-top:12px}
.browse-movie-card{display:flex;gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);min-width:0}
.browse-movie-poster{width:82px;height:123px;flex:0 0 82px;aspect-ratio:auto;align-self:flex-start;border-radius:9px;overflow:hidden;background:var(--surface)}
.browse-movie-poster .pw{display:block;width:100%;height:100%}
.browse-movie-poster .pimg,.browse-movie-poster .ph{width:100%;height:100%;object-fit:cover}
.browse-movie-content{min-width:0;display:flex;flex-direction:column;gap:5px}
.browse-movie-content h3{font-size:14px;font-weight:850;line-height:1.35;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.browse-movie-content .source-flag{position:static;width:19px;height:19px;border-radius:5px;font-size:10px;box-shadow:none;flex:none}
.browse-movie-meta{font-size:10px;color:var(--muted);line-height:1.4}
.browse-movie-overview{font-size:11px;line-height:1.5;color:var(--muted);margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.browse-movie-actions{display:flex;gap:7px;margin-top:auto}
.browse-movie-actions .btn{font-size:11px;padding:7px 9px;min-height:30px}
@media(max-width:380px){.browse-movie-poster{width:82px;height:123px;flex-basis:82px}.browse-movie-card{padding:10px;gap:9px}}

.source-flag{position:absolute;right:6px;top:6px;z-index:3;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font:800 11px/1 system-ui;color:#fff;box-shadow:0 1px 5px #0003}
.source-flag.json{background:#247a50}.source-flag.api{background:#3569b8}

/* ===== Layout fixes: consistent poster geometry and readable cards ===== */
.candidate-card {
  display:grid;
  grid-template-columns:82px minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
  min-width:0;
  overflow:hidden;
}
.candidate-poster {
  width:82px;
  height:123px;
  min-width:82px;
  flex:none;
  padding:0;
  overflow:hidden;
  border-radius:8px;
}
.candidate-poster .pw,
.candidate-poster .pimg,
.candidate-poster .ph {
  display:block;
  width:100%;
  height:100%;
}
.candidate-poster .pimg { object-fit:cover; }
.candidate-info { min-width:0; overflow:hidden; }
.candidate-info h4,
.candidate-meta,
.candidate-info p { min-width:0; overflow-wrap:anywhere; }
.candidate-info h4 { line-height:1.35; }
.candidate-info p {
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  line-height:1.5;
}
.candidate-pick { white-space:nowrap; flex-shrink:0; }

.today-movie-card { grid-template-columns:82px minmax(0,1fr); align-items:start; }
.today-movie-card .candidate-info { grid-column:2; }
.today-movie-card .candidate-info h4 { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.today-movie-card .candidate-info h4 .source-flag { position:static; width:19px; height:19px; flex:none; }
.today-movie-card #todayMoviePick { width:auto; min-height:34px; padding:7px 10px; white-space:normal; }

.browse-movie-card { min-width:0; }
.browse-movie-content { min-width:0; overflow:hidden; }
.browse-movie-content h3 { overflow-wrap:anywhere; }
.review-card { grid-template-columns:82px minmax(0,1fr); align-items:start; min-width:0; }
.review-card .review-poster { width:82px; height:123px; min-height:123px; overflow:hidden; }
.review-card .review-poster .pw,
.review-card .review-poster .pimg,
.review-card .review-poster .ph { display:block; width:100%; height:100%; }
.review-card > div:not(.review-poster) { min-width:0; overflow-wrap:anywhere; }
.movie-detail-poster { width:100px; flex:0 0 100px; height:150px; }
.movie-detail-poster .pw,
.movie-detail-poster .pimg,
.movie-detail-poster .ph { display:block; width:100%; height:100%; }
.movie-detail-poster .pimg { object-fit:cover; }

@media (max-width:600px) {
  .candidate-card {
    grid-template-columns:82px minmax(0,1fr);
    gap:10px;
    padding:11px;
    align-items:start;
  }
  .candidate-poster { width:82px; height:123px; }
  .candidate-pick {
    grid-column:2;
    justify-self:start;
    width:auto;
    max-width:100%;
    min-height:36px;
    padding:8px 12px;
  }
  .today-movie-card { grid-template-columns:82px minmax(0,1fr); }
  .review-card { grid-template-columns:82px minmax(0,1fr); column-gap:12px; }
  .movie-detail-poster { width:76px; flex-basis:76px; height:114px; }
}
@media (max-width:360px) {
  .candidate-card { grid-template-columns:70px minmax(0,1fr); gap:9px; }
  .candidate-poster { width:70px; min-width:70px; height:105px; }
  .candidate-info h4 { font-size:13px; }
  .candidate-info p { font-size:10px; }
  .candidate-pick { grid-column:2; }
  .today-movie-card { grid-template-columns:70px minmax(0,1fr); }
  .review-card { grid-template-columns:70px minmax(0,1fr); }
  .review-card .review-poster { width:70px; height:105px; min-height:105px; }
}

.ph .poster-status{display:block;font-size:9px;line-height:1.3;color:var(--muted);font-weight:600;text-align:center;margin-top:3px}

/* ===== Today's recommendation: cinema admission ticket ===== */
.today-ticket{position:relative;width:100%;overflow:hidden;background:#fff;border:1px solid #d8d2c8;border-radius:15px;color:#202020;box-shadow:0 8px 24px rgba(25,22,18,.07)}
.today-ticket-topline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px 11px;background:#fbfaf7;color:#77716a;font-size:9px;letter-spacing:.13em;font-weight:850}
.ticket-brand{color:#262626}.ticket-brand i{font-style:normal;color:#aaa}.ticket-number{font-size:8px;letter-spacing:.1em;color:#8b8379}
.today-ticket-poster{height:auto;aspect-ratio:2/3;position:relative;overflow:hidden;background:#f1eee8}
.today-ticket-poster .pw,.today-ticket-poster .pimg,.today-ticket-poster .ph{display:block;width:100%;height:100%}
.today-ticket-poster .pimg{width:100%;height:100%;object-fit:contain;object-position:center}
.today-ticket-poster .ph{display:flex;align-items:center;justify-content:center}
.ticket-poster-shade{position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.38));pointer-events:none}
.ticket-poster-label{position:absolute;left:16px;bottom:12px;color:white;font-size:9px;font-weight:900;letter-spacing:.2em;text-shadow:0 1px 5px #0008}
.today-ticket-main{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:15px;padding:18px 17px 16px}
.today-ticket-info{min-width:0}.ticket-overline{font-size:9px;letter-spacing:.14em;color:#91877b;font-weight:900;margin-bottom:5px}
.today-ticket-info h3{font-size:23px;line-height:1.25;letter-spacing:-.055em;margin:0 0 6px;color:#171717;overflow-wrap:anywhere}
.today-ticket-info h3 .source-flag{position:static;display:inline-grid;vertical-align:middle;width:18px;height:18px;font-size:9px;border-radius:4px}
.ticket-meta{font-size:11px;color:#77716a}.ticket-meta span{padding:0 3px;color:#b2aaa0}
.today-ticket-info p{font-size:11px;line-height:1.65;color:#77716a;margin:10px 0 11px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ticket-tags{display:flex;gap:6px;flex-wrap:wrap}.ticket-tags span{font-size:9px;color:#55504a;border:1px solid #e4dfd7;border-radius:4px;padding:4px 7px;background:#fbfaf7}
.ticket-side-code{align-self:end;display:flex;flex-direction:column;align-items:center;gap:7px;padding-bottom:2px}
.ticket-barcode{width:66px;height:48px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 13px,#222 13px 14px,transparent 14px 17px);opacity:.78}
.ticket-side-code small{font-size:7px;letter-spacing:.08em;color:#8a837b}
.today-ticket-perforation{height:29px;display:flex;align-items:center;gap:10px;padding:0 17px;color:#9a9186;font-size:8px;font-weight:900;letter-spacing:.16em}
.ticket-perf-line{height:1px;flex:1;border-top:1px dashed #cfc7bc}
.today-ticket-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 14px;background:#fbfaf7;border-top:1px solid #eee9e1}
.today-ticket-footer>span{font-size:8px;letter-spacing:.13em;color:#9a9186;font-weight:850}
.today-ticket-footer .btn{min-height:37px;padding:8px 13px;border-radius:7px;font-size:11px;background:#171717;color:#fff;border-color:#171717;white-space:nowrap}

/* ===== 홈 화면 영화 컬렉션: 가로 스와이프 + 순위 ===== */
.home-collection{margin-top:23px}
.home-collection-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.home-collection-head .home-section-title{margin:0 0 3px}
.home-collection-note{font-size:10px;color:var(--muted);margin:0}
.home-collection-more{font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.home-rank-row,.home-release-row{display:flex;gap:11px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
/* Home movie rails: swipe on touch, click-and-drag with a mouse */
.home-collection-track{display:flex;align-items:flex-start;gap:12px;width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 2px 13px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#999 transparent;cursor:grab;user-select:none;-webkit-user-select:none}
.home-collection-track:active{cursor:grabbing}
.home-collection-track::-webkit-scrollbar{height:5px}
.home-collection-track::-webkit-scrollbar-track{background:transparent}
.home-collection-track::-webkit-scrollbar-thumb{background:#999;border-radius:99px}
.home-collection-track img{-webkit-user-drag:none;user-drag:none}
.home-collection-track.is-dragging{scroll-snap-type:none;scroll-behavior:auto}
.home-collection-track.is-dragging *{pointer-events:none}
.home-rank-card,.home-release-card{position:relative;flex:0 0 116px;min-width:0;scroll-snap-align:start;border:0;background:transparent;text-align:left;padding:0;color:var(--ink);cursor:pointer}

 async function searchMovieAPI(query){
   const url=new URL('https://api.themoviedb.org/3/search/movie');
   url.searchParams.set('api_key',TMDB_API_KEY); url.searchParams.set('query',query);
   url.searchParams.set('language','ko-KR'); url.searchParams.set('include_adult','false');
   const res=await fetch(url.toString()); if(!res.ok) throw new Error('TMDB '+res.status);
   const data=await res.json();
   const hits=(data.results||[]).filter(r=>r.title||r.original_title);
   return hits.map((r,i)=>{
     const title=r.title||r.original_title, year=Number((r.release_date||'').slice(0,4))||'';
     const genreMap={28:'액션',12:'모험',16:'애니메이션',35:'코미디',80:'범죄',99:'다큐멘터리',18:'드라마',10751:'가족',14:'판타지',36:'역사',27:'공포',10402:'음악',9648:'미스터리',10749:'로맨스',878:'SF',10770:'TV 영화',53:'스릴러',10752:'전쟁',37:'서부'};
     const genres=(r.genre_ids||[]).map(id=>genreMap[id]).filter(Boolean);
     const id='api_'+r.id;
     return {id,title,en:(r.original_title||title).toUpperCase(),year,runtime:null,genre:genres.join(' · ')||'영화',moods:['심심한','센치한'],food:foodSuggestion(title,genres),tone:'새로운 영화를 발견하는 밤',overview:r.overview||'줄거리 정보가 없습니다.',poster:r.poster_path?TMDB_IMAGE+r.poster_path:'',source:'A',tmdbId:r.id};
   });
 }

 let apiMovies=[];
 const apiCatalogPromises=new Map();
 async function loadApiCatalog(yearArg=null){
   const yearKey=yearArg?String(yearArg):'all';
   if(apiCatalogPromises.has(yearKey)) return apiCatalogPromises.get(yearKey);
   const task=(async()=>{
     const genreMap={28:'액션',12:'모험',16:'애니메이션',35:'코미디',80:'범죄',99:'다큐멘터리',18:'드라마',10751:'가족',14:'판타지',36:'역사',27:'공포',10402:'음악',9648:'미스터리',10749:'로맨스',878:'SF',10770:'TV 영화',53:'스릴러',10752:'전쟁',37:'서부'};
     const cacheKey=yearArg?`cinepick_tmdb_catalog_year_${yearKey}_v1`:'cinepick_tmdb_catalog_200_v6';
     const toMovie=r=>{
       const title=r.title||r.original_title||'제목 정보 없음';
       const genreList=(r.genre_ids||[]).map(id=>genreMap[id]).filter(Boolean);
       const genreText=genreList.join(' ');
       return {id:'api_'+r.id,title,en:(r.original_title||title).toUpperCase(),year:Number((r.release_date||'').slice(0,4))||'',runtime:Number(r.runtime)||null,genre:genreList.join(' · ')||'영화',moods:['심심한','센치한'],food:foodSuggestion(title,genreText),tone:'새로운 영화를 발견하는 밤',overview:r.overview||'줄거리 정보가 없습니다.',poster:r.poster_path?(String(r.poster_path).startsWith('http')?r.poster_path:TMDB_IMAGE+r.poster_path):'',source:'A',tmdbId:r.id};
     };
     const publish=()=>{
       apiMovies.forEach(m=>{if(!movies.some(x=>x.id===m.id))movies.push(m);});
       const status=document.getElementById('datasetStatus');
       if(status)status.textContent=`총 ${localMovies.length+apiMovies.length}편 · J ${localMovies.length} / A ${apiMovies.length}`;
       if(state.activeTab==='browse')updateBrowse();
     };
     try{
       let cached=[];
       try{cached=cineRead(cacheKey,[]);}catch(_){}
       if(Array.isArray(cached)&&cached.length>0&&cached.every(m=>m&&m.id&&m.tmdbId&&m.source==='A')){
         const ids=new Set(apiMovies.map(m=>m.tmdbId));
         cached.forEach(m=>{if(!ids.has(m.tmdbId)){ids.add(m.tmdbId);apiMovies.push(m);}});
         publish();
       }
       const requests=await Promise.allSettled(Array.from({length:10},(_,i)=>{
         const u=new URL('https://api.themoviedb.org/3/discover/movie');
         u.searchParams.set('api_key',TMDB_API_KEY);u.searchParams.set('language','ko-KR');
         u.searchParams.set('sort_by','popularity.desc');u.searchParams.set('include_adult','false');if(yearArg)u.searchParams.set('primary_release_year',String(yearArg));u.searchParams.set('page',String(i+1));
         return fetch(u.toString()).then(r=>{if(!r.ok)throw new Error('TMDB '+r.status);return r.json();});
       }));
       const raw=requests.filter(x=>x.status==='fulfilled').flatMap(x=>x.value.results||[]);
       const seen=new Set();
       const fresh=raw.filter(r=>(r.title||r.original_title)&&r.id&&!seen.has(r.id)&&seen.add(r.id)).map(toMovie);
       if(fresh.length){
         // Prefer fresh data, but use a valid cache to top up if the API partially failed.
         let prior=[];try{prior=cineRead(cacheKey,[]);}catch(_){}
         const combined=[...fresh,...(Array.isArray(prior)?prior:[])];
         const ids=new Set(apiMovies.map(m=>m.tmdbId));
         combined.forEach(m=>{if(m&&m.tmdbId&&!ids.has(m.tmdbId)){ids.add(m.tmdbId);apiMovies.push(m);}});
         publish();
         try{cineWrite(cacheKey,yearArg?fresh.slice(0,200):apiMovies.slice(0,200));}catch(_){}
       }else if(!apiMovies.length){
         const status=document.getElementById('datasetStatus');
         if(status)status.textContent='TMDB API 연결 실패 · 네트워크와 API 키를 확인해 주세요.';
                   if(state.activeTab==='browse')updateBrowse();
       }
       // Enrich runtimes in the background; don't block the 200 movie list.
       let idx=0;
       const workers=Array.from({length:8},async()=>{
         while(idx<apiMovies.length){
           const m=apiMovies[idx++];if(m.runtime||!m.tmdbId)continue;
           try{
             const u=new URL(`https://api.themoviedb.org/3/movie/${m.tmdbId}`);
             u.searchParams.set('api_key',TMDB_API_KEY);u.searchParams.set('language','ko-KR');
             const r=await fetch(u.toString());if(r.ok){const d=await r.json();m.runtime=Number(d.runtime)||null;}
           }catch(_){}
         }
       });
       Promise.all(workers).then(()=>{try{cineWrite(cacheKey,yearArg?apiMovies.filter(m=>Number(m.year)===Number(yearArg)).slice(-200):apiMovies.slice(0,200));}catch(_){}if(state.activeTab==='browse')updateBrowse();});
       return apiMovies;
     }catch(err){
       console.warn('TMDB catalog load failed',err);
               if(state.activeTab==='browse')updateBrowse();
        throw err;
     }
   })();
   apiCatalogPromises.set(yearKey,task);
   return task;
 }

 const posterTitleKey = value => String(value || '').toLocaleLowerCase('ko-KR').normalize('NFKC').replace(/[^\p{L}\p{N}]/gu, '');
 function loadPosterCache(){
   try {
     const c = cineRead(POSTER_CACHE,{});
     localMovies.forEach(m => {
       const saved = c[m.id];
       if(saved && saved.titleKey === posterTitleKey(m.title) && String(saved.year) === String(m.year) && typeof saved.url === 'string' && saved.url.startsWith(TMDB_IMAGE + '/')) m.poster = saved.url;
     });
   } catch(e) { /* 캐시 오류는 무시하고 새로 검색 */ }
 }
 function posterNameMatches(result, aliases){
   const names = [result.title, result.original_title].filter(Boolean).map(posterTitleKey);
   const keys = aliases.map(posterTitleKey).filter(Boolean);
   for(const name of names){
     for(const key of keys){
       if(name === key) return true;
       if(key.length >= 5 && name.length >= 5 && (name.includes(key) || key.includes(name))) return true;
     }
   }
   return false;
 }
 async function searchPoster(m){
   const aliases = [...new Set([m.title, m.en].filter(Boolean))];
   const queries = [];
   if(m.title) queries.push({lang:'ko-KR',q:m.title});
   if(m.en) queries.push({lang:'en-US',q:m.en});
   for(const {lang,q} of queries){
     const url = new URL('https://api.themoviedb.org/3/search/movie');
     url.searchParams.set('api_key', TMDB_API_KEY);
     url.searchParams.set('query', q);
     url.searchParams.set('language', lang);
     url.searchParams.set('include_adult', 'false');
     if(m.year) url.searchParams.set('year', String(m.year));
     const res = await fetch(url.toString());
     if(!res.ok) throw new Error('TMDB ' + res.status);
     const data = await res.json();
     const hits = (data.results || []).filter(r => r.poster_path && posterNameMatches(r, aliases));
     const exactYear = hits.find(r => String((r.release_date || '').slice(0,4)) === String(m.year));
     if(exactYear) return exactYear;
     const nearYear = hits.find(r => { const y = Number((r.release_date || '').slice(0,4)); return y && m.year && Math.abs(y - Number(m.year)) <= 1; });
     if(nearYear) return nearYear;
   }
   return null;
 }
 async function loadTMDBPosters(){
   const pending = localMovies.filter(m => !m.poster);
   const found = {};
   let index = 0, failed = 0, missing = 0;
   const workers = Array.from({length:4}, async () => {
     while(index < pending.length){
       const m = pending[index++];
       m.posterStatus = 'loading';
       try {
         const hit = await searchPoster(m);
         if(hit && hit.poster_path){
           m.poster = TMDB_IMAGE + hit.poster_path;
           m.posterStatus = 'loaded';
           found[m.id] = {url:m.poster, titleKey:posterTitleKey(m.title), year:m.year};
         } else { m.posterStatus = 'missing'; missing++; }
         applyPoster(m);
       } catch(e) {
         m.posterStatus = 'error'; failed++;
         applyPoster(m);
         console.warn('포스터 검색 실패:', m.title, e);
       }
     }
   });
   await Promise.all(workers);
   try {
     const previous = cineRead(POSTER_CACHE,{});
     cineWrite(POSTER_CACHE, {...previous, ...found});
   } catch(e) { /* 저장 공간이 없어도 현재 화면은 유지 */ }
   const status = document.getElementById('datasetStatus');
   if(status) status.textContent = failed ? `포스터 완료 · ${failed}편 연결 오류` : missing ? `포스터 완료 · ${missing}편 포스터 미등록` : '포스터 모두 확인 완료';
 }

 function enableHomeRailDrag(track){
   if(!track || track.dataset.dragReady==='1')return;
   track.dataset.dragReady='1';
   let down=false,startX=0,startScroll=0,moved=false;
   track.addEventListener('pointerdown',e=>{
     if(e.pointerType==='touch'||e.button!==0)return;
           down=true;moved=false;startX=e.clientX;startScroll=track.scrollLeft;
   });
   window.addEventListener('pointermove',e=>{
     if(!down)return;
     const dx=e.clientX-startX;
           if(Math.abs(dx)>4&&!moved){moved=true;track.classList.add('is-dragging');}
      if(moved)track.scrollLeft=startScroll-dx;
   });
   const finish=()=>{
     if(!down)return;
           down=false;track.classList.remove('is-dragging');
     if(moved){
       track.dataset.suppressClick='1';
       setTimeout(()=>{track.dataset.suppressClick='0';},0);
     }
   };
   window.addEventListener('pointerup',finish);
   window.addEventListener('pointercancel',finish);
   track.addEventListener('click',e=>{
     if(track.dataset.suppressClick==='1'){e.preventDefault();e.stopPropagation();track.dataset.suppressClick='0';}
   },true);
 }

function actorQueryVariants(query){
  const raw=String(query||'').trim(), tight=raw.replace(/\s+/g,'');
  const k=norm(raw), out=[raw];
  if(tight!==raw)out.push(tight);
  if(ACTOR_ALIASES[k])out.push(ACTOR_ALIASES[k]);
  else if(k.length>=3){ // 일부만 입력해도(예: '톰 크루') 이름표에서 찾기
    for(const key of Object.keys(ACTOR_ALIASES)){ if(key.startsWith(k)){ out.push(ACTOR_ALIASES[key]); break; } }
  }
  return [...new Set(out)];
}
async function fetchPeople(name,lang){
  const u=new URL('https://api.themoviedb.org/3/search/person');
  u.searchParams.set('api_key',TMDB_API_KEY);u.searchParams.set('query',name);u.searchParams.set('language',lang);u.searchParams.set('include_adult','false');
  const r=await fetch(u);if(!r.ok)return [];
  return (await r.json()).results||[];
}
async function searchActorMovieIds(query){
  if(actorSearchCache.has(query))return actorSearchCache.get(query);
  const variants=actorQueryVariants(query);
  const lists=await Promise.all(variants.map(v=>fetchPeople(v,'ko-KR').catch(()=>[])));
  const seenP=new Set(),people=[];
  lists.forEach(list=>{
    const acting=list.filter(p=>p.known_for_department==='Acting');
    (acting.length?acting:list).slice(0,3).forEach(p=>{if(!seenP.has(p.id)){seenP.add(p.id);people.push(p);}});
  });
  const top=people.slice(0,3);
  if(!top.length&&!variants.length)throw new Error('인물 검색 실패');
  const byTmdb=new Map();
  await Promise.all(top.map(async person=>{
    const cu=new URL(`https://api.themoviedb.org/3/person/${person.id}/movie_credits`);
    cu.searchParams.set('api_key',TMDB_API_KEY);cu.searchParams.set('language','ko-KR');
    try{
      const cr=await fetch(cu);if(!cr.ok)return;const d=await cr.json();
      (d.cast||[]).filter(m=>m&&m.id&&(m.title||m.original_title)).sort((x,y)=>(y.popularity||0)-(x.popularity||0)).slice(0,40)
        .forEach(m=>{if(!byTmdb.has(m.id))byTmdb.set(m.id,tmdbMovieToCard(m));});
    }catch(_){}
  }));
  const cards=[...byTmdb.values()].slice(0,80);
  actorSearchCache.set(query,cards);return cards;
}
function scheduleActorSearch(q){

}

const rvAge=r=>r.mine?-1:(parseInt(String(r.date).replace(/\D/g,''),10)||0);
const rvLikesKey='cinepickReviewLikes';
const rvLikes=()=>{try{return cineRead(rvLikesKey,{})||{}}catch(_){return {}}};
const rvAvatar=(name,big)=>{const h=rvHash(name)%360;return `<i class="rv-av${big?' big':''}" style="background:hsl(${h} 55% 90%);color:hsl(${h} 42% 30%)">${esc(Array.from(String(name))[0]||'?')}</i>`;};
const rvCountLabel=n=>n>=100?'100+':String(n);

/* 예시 리뷰 보충 + 시드 영화 연결 + 작성자 닉네임(같은 영화 안에서는 중복 없음) */
function prepareReviews(){
  const byTitle=new Map();
  movies.forEach(m=>{const k=rvKey(m.title);if(k&&!byTitle.has(k))byTitle.set(k,m);});
  const count=new Map();
  communityReviews.forEach(r=>{
    const k=rvKey(r.movieTitle),m=byTitle.get(k);
    if(m){r.movieId=m.id;r.movieTitle=m.title;}
    count.set(k,(count.get(k)||0)+1);
  });
  movies.forEach((m,index)=>{
    const title=String(m.title||'').trim();if(!title)return;
    const key=rvKey(title);
    for(let i=count.get(key)||0;i<3;i++){
      const t=REVIEW_TEMPLATES[i%REVIEW_TEMPLATES.length];
      communityReviews.push({id:`auto_${String(m.id).replace(/[^a-zA-Z0-9_-]/g,'_')}_${i+1}`,movieId:m.id,movieTitle:title,user:'',rating:i===2?5.0:4.5,date:`${70+index*3+i}일 전`,title:`${title} · ${t[0]}`,review:`${title}은(는) ${m.genre||'영화'}의 매력을 자연스럽게 보여준다. ${t[1]}`,likes:0});
    }
    if((count.get(key)||0)<3)count.set(key,3);
  });
  const used=new Map();
  const setOf=k=>used.get(k)||used.set(k,new Set()).get(k);
  communityReviews.forEach(r=>{if(r._nick)setOf(rvKey(r.movieTitle)).add(r.user);});
  communityReviews.forEach(r=>{
    if(r._nick)return;
    const set=setOf(rvKey(r.movieTitle));
    let n=rvHash(r.id)%REVIEW_NICKS.length,t=0;
    while(set.has(REVIEW_NICKS[n])&&t++<REVIEW_NICKS.length)n=(n+1)%REVIEW_NICKS.length;
    r.user=REVIEW_NICKS[n];r._nick=true;set.add(r.user);
  });
}
const rvAllReviews=()=>{prepareReviews();return [...myReviews().map(r=>({...r,user:'나',mine:true,movieTitle:(byId(r.movieId)||{}).title})),...communityReviews];};
function rvBuildCtx(rows){
  const cnt=new Map(),sum=new Map();
  rows.forEach(r=>{cnt.set(r.movieId,(cnt.get(r.movieId)||0)+1);sum.set(r.movieId,(sum.get(r.movieId)||0)+Number(r.rating||0));});
  return {rows,cnt,likes:rvLikes(),avg:id=>cnt.get(id)?sum.get(id)/cnt.get(id):0};
}

/* 카탈로그에 없는 예시 영화(시드)의 포스터·정보를 TMDB에서 가져와 썸네일을 채웁니다 */
const RV_GENRES={28:'액션',12:'모험',16:'애니메이션',35:'코미디',80:'범죄',99:'다큐멘터리',18:'드라마',10751:'가족',14:'판타지',36:'역사',27:'공포',10402:'음악',9648:'미스터리',10749:'로맨스',878:'SF',10770:'TV 영화',53:'스릴러',10752:'전쟁',37:'서부'};
let rvPosterBusy=false;
async function ensureReviewPosters(){
  const seeds=movies.filter(m=>String(m.id).startsWith('seed_movie_')&&!m.poster);
  if(!seeds.length||rvPosterBusy)return;
  let cache={};try{cache=cineRead('cinepickSeedMetaV1',{})||{};}catch(_){}
  const apply=(m,c)=>{m.poster=c.poster;if(c.year)m.year=c.year;if(c.genre)m.genre=c.genre;if(c.overview)m.overview=c.overview;if(c.tmdbId)m.tmdbId=c.tmdbId;if(c.en)m.en=c.en;if(c.rating)m.rating=c.rating;m.food=foodSuggestion(m.title,m.genre);m.posterStatus='loaded';applyPoster(m);};
  seeds.forEach(m=>{const c=cache[m.id];if(c&&c.poster&&c.titleKey===posterTitleKey(m.title))apply(m,c);});
  const todo=seeds.filter(m=>!m.poster&&m.posterStatus!=='error'&&m.posterStatus!=='missing');
  if(!todo.length)return;
  rvPosterBusy=true;
  let i=0;
  const worker=async()=>{
    while(i<todo.length){
      const m=todo[i++];m.posterStatus='loading';
      try{
        const url=new URL('https://api.themoviedb.org/3/search/movie');
        url.searchParams.set('api_key',TMDB_API_KEY);url.searchParams.set('query',m.title);url.searchParams.set('language','ko-KR');url.searchParams.set('include_adult','false');
        const res=await fetch(url.toString());if(!res.ok)throw new Error('TMDB '+res.status);
        const data=await res.json();
        const hit=(data.results||[]).find(r=>r.poster_path&&posterNameMatches(r,[m.title]));
        if(!hit){m.posterStatus='missing';applyPoster(m);continue;}
        const c={poster:TMDB_IMAGE+hit.poster_path,titleKey:posterTitleKey(m.title),year:Number((hit.release_date||'').slice(0,4))||'',genre:(hit.genre_ids||[]).map(g=>RV_GENRES[g]).filter(Boolean).join(' · ')||m.genre,overview:hit.overview||m.overview,tmdbId:hit.id,en:(hit.original_title||m.en||m.title).toUpperCase(),rating:hit.vote_average>0?Number((hit.vote_average/2).toFixed(1)):undefined};
        apply(m,c);cache[m.id]=c;try{cineWrite('cinepickSeedMetaV1',cache);}catch(_){}
      }catch(e){m.posterStatus='error';applyPoster(m);}
    }
  };
  await Promise.all(Array.from({length:4},worker));
  rvPosterBusy=false;
}

/* 리뷰 카드: 포스터(→영화 상세) · 영화 제목(→그 영화 리뷰들) · 작성자(→후기 모음) · 카드 탭(→아래로 펼침) · 말풍선 N(→같은 영화 리뷰 주르륵) */
function rvCardHTML(r,ctx){
  const m=byId(r.movieId)||{id:r.movieId,title:r.movieTitle||'영화',poster:''};
  const title=m.title||r.movieTitle||'영화';
  const on=!!ctx.likes[r.id+'_on'],n=Number(ctx.likes[r.id]??r.likes??0);
  const total=ctx.cnt.get(r.movieId)||1;
  const rating=Number(r.rating||0);
  const info=[m.year,m.genre&&m.genre!=='영화'?m.genre:'',m.runtime?m.runtime+'분':''].filter(Boolean).join(' · ');
  const more=(info||r.mine)?`<div class="rv-more">${info?`<span class="rv-info">${esc(info)}</span>`:''}${r.mine?`<span class="rv-own"><button type="button" class="btn rv-icon-btn is-edit" data-rv-edit aria-label="내 리뷰 수정" title="내 리뷰 수정">${ICON.eraser}</button><button type="button" class="btn danger rv-del" data-rv-del>삭제</button></span>`:''}</div>`:'';
  return `<article class="rv-card${r.mine?' mine':''}" data-rv="${esc(r.id)}">
  <button type="button" class="rv-poster" aria-label="${esc(title)} 영화 정보 보기">${posterHTML(m)}</button>
  <div class="rv-main">
    <div class="rv-top">
      <button type="button" class="rv-movie" data-rv-movie aria-label="${esc(title)} 리뷰 모아보기"><span class="rv-movie-name">${esc(title)}</span><span class="rv-movie-arrow" aria-hidden="true">›</span></button>
      <span class="rv-stars" aria-label="별점 ${rating.toFixed(1)}점">${stars(rating)}<em>${rating.toFixed(1)}</em></span>
    </div>
    <div class="rv-toggle" role="button" tabindex="0" aria-expanded="false">
      ${r.title?`<h4>${esc(r.title)}</h4>`:''}
      <p class="rv-text">${esc(r.review)}</p>
    </div>
    ${more}
    <div class="rv-meta">${r.mine?'<span class="mine-badge">나</span>':`<button type="button" class="rv-author" data-rv-author="${esc(r.user)}">${rvAvatar(r.user)}${esc(r.user)}</button>`}<span>· ${esc(r.date)}</span></div>
    <div class="rv-actions">
      <button type="button" class="review-like ${on?'liked':''}" data-rv-like aria-label="좋아요">${on?'♥':'♡'} <span>${n}</span></button>
      <button type="button" class="rv-count" data-rv-same aria-expanded="false" aria-label="같은 영화 리뷰 ${total}개 보기" title="같은 영화 리뷰 보기">${ICON.chat}<b>${rvCountLabel(total)}</b></button>
    </div>
  </div>
  <div class="rv-same" hidden></div>
  </article>`;
}
function rvSameHTML(r,ctx){
  const m=byId(r.movieId)||{title:r.movieTitle||'영화'};
  const list=ctx.rows.filter(x=>x.movieId===r.movieId).sort((a,b)=>rvAge(a)-rvAge(b));
  return `<div class="rv-same-head">‘${esc(m.title)}’ 리뷰 ${list.length}개</div>`+list.map(x=>`<div class="rv-mini${x.id===r.id?' cur':''}"><div class="rv-mini-top">${x.mine?'<span class="mine-badge">나</span>':`<button type="button" class="rv-author" data-rv-author="${esc(x.user)}">${rvAvatar(x.user)}${esc(x.user)}</button>`}<span class="rv-mini-date">${esc(x.date)}</span><span class="rv-stars">${stars(Number(x.rating||0))}</span></div>${x.title?`<b>${esc(x.title)}</b>`:''}<p>${esc(x.review)}</p></div>`).join('');
}
function wireReviewCards(box,h){
  box._rvH=h;
  if(box.dataset.rvWired)return;
  box.dataset.rvWired='1';
  const flip=card=>{const on=!card.classList.contains('open');card.classList.toggle('open',on);const t=card.querySelector('.rv-toggle');if(t)t.setAttribute('aria-expanded',String(on));};
  box.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.rv-toggle');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flip(t.closest('.rv-card'));}});
  box.addEventListener('click',e=>{
    const H=box._rvH,t=e.target,card=t.closest('.rv-card');
    if(!card)return;
    const r=H.find(card.dataset.rv);if(!r)return;
    let b;
    if((b=t.closest('[data-rv-author]'))){H.goAuthor(b.dataset.rvAuthor);return;}
    if(t.closest('.rv-poster')){openMovieDetail(r.movieId);return;}
    if(t.closest('[data-rv-movie]')){H.goMovie(r.movieId);return;}
    if((b=t.closest('[data-rv-like]'))){
      const cur=rvLikes(),id=r.id,was=!!cur[id+'_on'];
      cur[id]=Math.max(0,Number(cur[id]??r.likes??0)+(was?-1:1));cur[id+'_on']=!was;
      try{cineWrite(rvLikesKey,cur)}catch(_){}
      b.classList.toggle('liked',!was);b.innerHTML=`${!was?'♥':'♡'} <span>${cur[id]}</span>`;return;
    }
    if((b=t.closest('[data-rv-same]'))){
      const panel=card.querySelector('.rv-same'),open=panel.hidden;
      if(open)panel.innerHTML=rvSameHTML(r,H.ctx());
      panel.hidden=!open;b.classList.toggle('on',open);b.setAttribute('aria-expanded',String(open));return;
    }
    if(t.closest('[data-rv-edit]')){openReviewEditor(r.movieId,H.rerender);return;}
    if((b=t.closest('[data-rv-del]'))){
      if(!b.classList.contains('on')){b.classList.add('on');b.textContent='정말 삭제';return;}
      saveMyReviews(myReviews().filter(x=>x.id!==r.id));showToast('리뷰를 삭제했어요.');H.rerender();return;
    }
    if(t.closest('.rv-toggle'))flip(card);
  });
}

function renderReviewTab(){

  const stack=[];
  if(rvNav){view={mode:rvNav.mode||(rvNav.movie?'movie':'recent'),movie:rvNav.movie||'',author:rvNav.author||''};rvNav=null;}
  workspace.innerHTML=`<div class="browse-screen rv-screen">

  <p class="browse-subtitle" id="reviewCategoryDesc"></p>
  <div class="review-mode-buttons" role="group" aria-label="리뷰 보기 방식">
    <button type="button" class="review-mode-btn" data-mode="recent">최근</button>
    <button type="button" class="review-mode-btn" data-mode="popular">인기</button>
    <button type="button" class="review-mode-btn" data-mode="movie">영화별 리뷰</button>
  </div>
  <div id="reviewMovieSearchWrap" class="review-movie-search" hidden><input id="reviewMovieSearch" type="search" placeholder="영화 제목 검색" aria-label="영화 제목 검색"></div>
  <div id="reviewTabList"></div>
  </div>`;
  const listEl=$('#reviewTabList'),searchWrap=$('#reviewMovieSearchWrap'),searchEl=$('#reviewMovieSearch'),descEl=$('#reviewCategoryDesc');
  let rows=[],ctx=null;
  const find=id=>rows.find(x=>String(x.id)===String(id));
  const avgText=v=>v?v.toFixed(1):'-';
  const go=next=>{stack.push({...view});view={...view,...next};paint();window.scrollTo(0,0);};
  const back=()=>{view=stack.pop()||{mode:'recent',movie:'',author:''};paint();window.scrollTo(0,0);};
  function paint(){
    rows=rvAllReviews();ctx=rvBuildCtx(rows);
    const {mode,movie,author}=view;
    workspace.querySelectorAll('[data-mode]').forEach(b=>{const on=!author&&b.dataset.mode===mode;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});

    const age=(a,b)=>rvAge(a)-rvAge(b);
    const lk=r=>Number(ctx.likes[r.id]??r.likes??0);
    let html='';
    if(author){
      const rs=rows.filter(r=>r.user===author).sort(age);
      const ms=[...new Set(rs.map(r=>r.movieId))].map(byId).filter(Boolean);
      const avg=rs.length?rs.reduce((t,r)=>t+Number(r.rating||0),0)/rs.length:0;
      descEl.textContent=`${author}님이 남긴 후기 모음`;
      html=`<button type="button" class="rv-back" data-rv-back>${ICON.back}이전</button>
      <section class="rv-hero">${rvAvatar(author,true)}<div><h3>${esc(author)}</h3><p>후기 ${rs.length}개 · 평균 ★ ${avgText(avg)}</p><p>본 영화 ${ms.length}편</p></div></section>
      <div class="rv-strip" aria-label="${esc(author)}님이 본 영화">${ms.map(m=>`<button type="button" data-rv-open="${esc(m.id)}" aria-label="${esc(m.title)} 영화 정보">${posterHTML(m)}</button>`).join('')}</div>
      <div class="rv-list">${rs.map(r=>rvCardHTML(r,ctx)).join('')}</div>`;
    }else if(mode==='movie'&&movie){
      const m=byId(movie);
      if(!m){view.movie='';paint();return;}
      const rs=rows.filter(r=>r.movieId===movie).sort(age);
      const meta=[m.year,m.genre&&m.genre!=='영화'?m.genre:'',m.runtime?m.runtime+'분':''].filter(Boolean).join(' · ');
      descEl.textContent=`${m.title} 리뷰 ${rs.length}개`;
      html=`<button type="button" class="rv-back" data-rv-back>${ICON.back}영화별 리뷰</button>

      <div class="rv-list in-movie">${rs.map(r=>rvCardHTML(r,ctx)).join('')}</div>`;
    }else if(mode==='movie'){
      const q=norm(searchEl.value||'');
      const groups=new Map();
      rows.forEach(r=>{(groups.get(r.movieId)||groups.set(r.movieId,[]).get(r.movieId)).push(r);});
      const items=[...groups.entries()].map(([id,rs])=>({m:byId(id),rs})).filter(x=>x.m&&(!q||norm(x.m.title||'').includes(q)||norm(x.m.en||'').includes(q)));
      const byName=(a,b)=>String(a.m.title).localeCompare(String(b.m.title),'ko');
      items.sort(sort==='rating'?(a,b)=>ctx.avg(b.m.id)-ctx.avg(a.m.id)||byName(a,b):sort==='name'?byName:(a,b)=>b.rs.length-a.rs.length||b.rs.reduce((t,r)=>t+lk(r),0)-a.rs.reduce((t,r)=>t+lk(r),0)||byName(a,b));
      descEl.textContent='포스터를 누르면 그 영화의 리뷰만 모아서 볼 수 있어요.';

    }else{

      html=`<div class="rv-list">${sorted.map(r=>rvCardHTML(r,ctx)).join('')}</div>`;
    }
    listEl.innerHTML=html;
  }
  wireReviewCards(listEl,{find,ctx:()=>ctx,rerender:()=>paint(),goMovie:id=>go({mode:'movie',movie:id,author:''}),goAuthor:name=>go({author:name})});
  listEl.addEventListener('click',e=>{
    const t=e.target;let b;
    if((b=t.closest('[data-rv-sort]'))){sort=b.dataset.rvSort;paint();return;}
    if((b=t.closest('[data-rv-tile]'))){go({mode:'movie',movie:b.dataset.rvTile,author:''});return;}
    if((b=t.closest('[data-rv-back]'))){back();return;}
    if((b=t.closest('[data-rv-open]'))){openMovieDetail(b.dataset.rvOpen);return;}
    if(!t.closest('.rv-card')&&(b=t.closest('[data-write]'))){openReviewEditor(b.dataset.write,()=>paint());}
  });
  workspace.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{view={mode:btn.dataset.mode,movie:'',author:''};stack.length=0;paint();}));
  searchEl.addEventListener('input',()=>paint());
  paint();
}

  </div>`;
  const input = $('#browseQ'); input.placeholder='영화 제목·배우·장르 검색';

  $('#browseSearchBtn').addEventListener('click', applyBrowse);

  input.addEventListener('input', markPending);

  ['browseGenre','browseYear','browseRuntime'].forEach(id=>$('#'+id).addEventListener('change',markPending));
  $('#resetBrowseFilters').addEventListener('click',()=>{ input.value=''; ['browseGenre','browseYear','browseRuntime'].forEach(id=>$('#'+id).value=''); applyBrowse(); });
  updateBrowse();

 function updateBrowse(){
  if(!$('#movieResults')) return;
  const q=norm(browseApplied.q||'');
  const usingApi=apiMovies.length>0;
  const basePool=usingApi?apiMovies:localMovies;   // 기본 목록: API 200편 (API가 안 불러와지면 JSON 150편)
  const hasFilter=!!(q||browseApplied.genre||browseApplied.year||browseApplied.runtime);
  // 검색·필터: JSON(J) + API(A) + 배우 출연작을 합치고, 같은 영화(제목+연도)는 한 번만 표시
  const mKey=m=>norm(m.title||'')+'|'+(parseInt(m.year,10)||'');
  const seenKeys=new Set(),mergedPool=[];
  [...localMovies,...apiMovies,...(q?actorMovieCards:[])].forEach(m=>{const k=mKey(m);if(seenKeys.has(k))return;seenKeys.add(k);mergedPool.push(m);});
  const allMovies=hasFilter?mergedPool:basePool;
  const genreSel=$('#browseGenre'),yearSel=$('#browseYear');
  const genreOptions=['액션','모험','애니메이션','코미디','범죄','다큐멘터리','드라마','가족','판타지','역사','공포','음악','미스터리','로맨스','SF','TV 영화','스릴러','전쟁','서부'];
  if(genreSel && genreSel.dataset.optionsReady!=='1'){
    const old=genreSel.value;
    genreSel.innerHTML='<option value="">전체 장르</option>'+genreOptions.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
    genreSel.value=old;genreSel.dataset.optionsReady='1';
  }
  if(yearSel){
    const old=yearSel.value;
    const latestYear=new Date().getFullYear();
    const choices=Array.from({length:latestYear-1870+1},(_,i)=>latestYear-i);
    const signature=choices.join(',');
    if(yearSel.dataset.yearSignature!==signature){
      yearSel.innerHTML='<option value="">전체 연도</option>'+choices.map(y=>`<option value="${y}">${y}년</option>`).join('');
      yearSel.dataset.yearSignature=signature;
      yearSel.value=choices.includes(parseInt(old,10))?String(parseInt(old,10)):'';
    }
  }
  const {genre,year,runtime}=browseApplied;
  // 검색어: 제목·영문제목·장르 (JSON 영화는 분위기도). API 영화의 공통 문구(분위기/톤)는 제외해 엉뚱한 전체 일치를 막습니다.
  const textMatch=m=>!q||[m.title,m.en,m.genre,...(m.source==='J'&&Array.isArray(m.moods)?m.moods:[])].some(v=>v!=null&&norm(v).includes(q));
  const found=allMovies.filter(m=>{
    if(q&&!textMatch(m)&&!(m.tmdbId&&actorMatchedIds.has(Number(m.tmdbId))))return false;
    if(genre&&!String(m.genre||'').split(/[·,]/).map(x=>x.trim()).includes(genre))return false;
    if(year&&parseInt(m.year,10)!==parseInt(year,10))return false;
    const n=Number(m.runtime);
    if(runtime==='short'&&!(n>0&&n<=90))return false;
    if(runtime==='mid'&&!(n>=91&&n<=120))return false;
    if(runtime==='long'&&!(n>=121))return false;
    if(runtime==='unknown'&&n>0)return false;
    return true;
  });
  renderBrowseMovies(found,hasFilter?'검색 결과':(usingApi?'전체 영화':'전체 영화'));
  const sum=$('#filterSummary');
  const runtimePending=runtime&&allMovies.some(m=>m.source==='A'&&m.runtime==null);
  if(sum)sum.textContent=runtimePending?'러닝타임 정보를 아직 불러오는 중이에요. 잠시 후 다시 ‘검색’을 눌러 주세요.'
    :actorPending?`${found.length}편 일치 · 배우 출연작 검색 중…`
    :hasFilter?`${found.length}편의 영화가 조건에 맞아요.`
    :usingApi?`전체 영화 ${allMovies.length}편을 표시하고 있어요.`
    :`API를 불러오는 중이거나 연결되지 않아 JSON 영화 ${allMovies.length}편을 표시하고 있어요.`;

}

 const CINE_AUTH_KEY='cinepick_demo_accounts_v1';
 const CINE_SESSION_KEY='cinepick_demo_session_v1';
 function cineEscape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function cineAuthAccounts(){ try{return cineRead(CINE_AUTH_KEY,[])}catch(e){return []} }
 function cineAuthSession(){ try{return cineRead(CINE_SESSION_KEY,null)}catch(e){return null} }
 function cineAuthSetSession(user){cineWrite(CINE_SESSION_KEY,{email:user.email,nickname:user.nickname});}
 async function cinePasswordDigest(password,salt){
   const data=new TextEncoder().encode(salt+':'+password);
   if(window.crypto && crypto.subtle){const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('');}
   // Local-file fallback for prototype preview only.
   let h=216e7; for(const c of (salt+':'+password)) h=Math.imul(h^c.charCodeAt(0),16777619);
   return 'demo-'+(h>>>0).toString(16);
 }
 function openRecentMoviesModal(){

  </section>`;
  document.body.appendChild(overlay);
  const close=()=>{overlay.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();};

     $('#cineLogout').addEventListener('click',()=>{cineRemove(CINE_SESSION_KEY);renderMyPage();});
     return;
   }
   if(!user){
     workspace.innerHTML=`<div class="content cine-auth-page">
       <div class="cine-auth-hero"><h3>나만의 영화 생활을<br>시작해 보세요.</h3><p>로그인하고 찜한 영화와 나의 티켓을<br>한곳에서 관리해 보세요.</p></div>
       <div class="cine-auth-card">

           <div><label for="cineEmail">이메일</label><input id="cineEmail" type="email" placeholder="이메일 주소를 입력해 주세요" autocomplete="email" required></div>
           <div><label for="cinePassword">비밀번호</label><input id="cinePassword" type="password" placeholder="비밀번호를 입력해 주세요" minlength="6" autocomplete="current-password" required></div>
           <p class="cine-auth-error" id="cineAuthError" aria-live="polite"></p>
           <button class="cine-auth-submit" type="submit" id="cineAuthSubmit">로그인</button>
         </form>
         <p class="cine-auth-switch" id="cineAuthSwitch">아직 계정이 없으신가요? <button type="button" id="cineSwitchSignup">회원가입</button></p>
       </div>
       <p class="cine-auth-footnote">둘러보기와 영화 검색은 로그인 없이 이용할 수 있어요.</p>
     </div>`;
     let mode='login';
     const loginTab=$('#cineLoginTab'), signupTab=$('#cineSignupTab'), nicknameField=$('#cineNicknameField'), form=$('#cineAuthForm');
     function setMode(next){
       mode=next; const signup=mode==='signup';
       loginTab.classList.toggle('active',!signup); signupTab.classList.toggle('active',signup);
       nicknameField.hidden=!signup;
       $('#cineAuthSubmit').textContent=signup?'회원가입':'로그인';
       $('#cinePassword').autocomplete=signup?'new-password':'current-password';
       $('#cineAuthSwitch').innerHTML=signup?'이미 계정이 있으신가요? <button type="button" id="cineSwitchLogin">로그인</button>':'아직 계정이 없으신가요? <button type="button" id="cineSwitchSignup">회원가입</button>';
       const switchBtn=signup?$('#cineSwitchLogin'):$('#cineSwitchSignup');
       switchBtn.addEventListener('click',()=>setMode(signup?'login':'signup'));
       $('#cineAuthError').textContent='';
     }
     loginTab.addEventListener('click',()=>setMode('login'));
     signupTab.addEventListener('click',()=>setMode('signup'));
     $('#cineSwitchSignup').addEventListener('click',()=>setMode('signup'));
     form.addEventListener('submit',async e=>{
       e.preventDefault();
       const email=$('#cineEmail').value.trim().toLowerCase(), password=$('#cinePassword').value;
       const accounts=cineAuthAccounts(), error=$('#cineAuthError'), submit=$('#cineAuthSubmit');
       error.textContent=''; submit.disabled=true; submit.textContent='처리 중...';
       try{
         if(mode==='signup'){
           const nickname=$('#cineNickname').value.trim();
           if(!nickname){error.textContent='닉네임을 입력해 주세요.';return;}
           if(accounts.some(a=>a.email===email)){error.textContent='이미 가입된 이메일입니다. 로그인해 주세요.';return;}
           const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('');

           const account={email,nickname,salt,passwordHash,createdAt:Date.now()};
           accounts.push(account); cineWrite(CINE_AUTH_KEY,accounts); cineAuthSetSession(account);
         }else{
           const account=accounts.find(a=>a.email===email);
           if(!account){error.textContent='가입된 계정을 찾을 수 없습니다.';return;}
           const digest=await cinePasswordDigest(password,account.salt);
           if(digest!==account.passwordHash){error.textContent='이메일 또는 비밀번호를 확인해 주세요.';return;}
           cineAuthSetSession(account);

       finally{submit.disabled=false;submit.textContent=mode==='signup'?'회원가입':'로그인';}

 function updateAppTabs(){
 document.querySelectorAll('.app-tab').forEach(b=>{

 function render(){

 clearInterval(decideTimer); decideTimer = null;
 if(state.spinning && state.step !== 3){ clearTimeout(spinTimeout); state.spinning = false; }
 updateNavigation(); updateAppTabs();
 if(state.activeTab==='home') renderHome();
 else if(state.activeTab==='browse') renderBrowse();
 else if(state.activeTab==='review') renderReviewTab();
 else if(state.activeTab==='mypage') renderMyPage();
 else ({1:renderMood,2:renderDuration,3:renderWheel,4:renderResult,5:renderConfirmed,6:renderTicketbook,7:() => renderRecovery('all')})[state.step]();
 updateAppTabs();
 window.scrollTo(0, 0);
 }

 });
 document.getElementById('headerLoginButton').addEventListener('click', () => {

 });
 // 하단 탭은 항상 공통 render() 경로를 통해 화면 전체를 전환합니다.
 // 둘러보기를 누르면 커뮤니티 리뷰 목록을 즉시 렌더링합니다.
 document.querySelectorAll('[data-app-tab]').forEach(b=>b.addEventListener('click',()=>{
 const tab=b.dataset.appTab;
 state.activeTab=tab;

 if(tab==='recommend') { if(state.step===6 || state.step===7) state.step=1; if(!state.mood) state.step=1; }
 render();
 }));
 function updateNavigation(){
 document.querySelectorAll('.step-link').forEach(b => {
 const s = Number(b.dataset.step);
 b.classList.toggle('active', s === state.step);
 b.classList.toggle('done', state.step <= 5 && s < state.step);

 });

 document.querySelectorAll('.step-link').forEach(b => b.addEventListener('click', () => setStep(Number(b.dataset.step))));
  loadPosterCache();
 render();
 loadApiCatalog().catch(err=>{
   const status=document.getElementById('datasetStatus');
   if(status) status.textContent='API 영화 로딩 실패 · JSON 150편만 표시 중';

 loadTMDBPosters();
})();
